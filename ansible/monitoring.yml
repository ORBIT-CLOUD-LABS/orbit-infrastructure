---
# Node exporter 적용
# 실행: ansible-playbook monitoring.yml

# 모든 관리 노드: node-exporter (수집 대상)
# Monitoring VM의 Prometheus/Alertmanager/Loki/Grafana는 Docker Compose가 아니라
# systemd 서비스로 직접 구성한다 (orbit-observability#3 참고).
- name: Node exporter
  hosts: all
  become: true
  roles:
    - role: node_exporter
      tags: [monitoring, node_exporter]
