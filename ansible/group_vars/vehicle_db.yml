# astra-vehicle-db (astra, Lab 네트워크 192.168.100.0/24)
db_name: vehicle
db_app_user: vehicle_app
db_app_password: "{{ vault_vehicle_db_password | default('') }}"

# Terraform이 붙인 데이터 volume. VM에서 lsblk로 확인 후 맞출 것
db_data_device: /dev/vdb

# Calico IP Pool이 natOutgoing: Enabled라서 Pod가 클러스터 밖(DB VM)으로 나갈 때
# 출발지가 worker 노드 IP로 SNAT된다. 서버 Pod가 뜨는 worker만 허용한다
# (astra-worker-1 ~ 3, ansible/README.md 노드 표)
db_allowed_hosts: ["192.168.100.102", "192.168.100.103", "192.168.100.104"]
db_app_client_group: workers

# orbit-server 연결 수: HPA 최대 4 + 롤링 업데이트 중 1개, 파드당 Hikari pool 5
# (orbit-gitops#7 의 SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE 와 맞출 것)
# → 5 × 5 + 운영 여유 20 = 45 ≤ max_connections 200
db_app_pool_size: 5
db_app_max_replicas: 4
db_app_surge_replicas: 1
