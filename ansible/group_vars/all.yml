# 관리 노드 접속 (Terraform이 만든 VM의 계정과 같아야 함)
ansible_user: orbit
ansible_python_interpreter: /usr/bin/python3

# Kubernetes 마이너 버전 (pkgs.k8s.io 저장소 경로에 들어감)
k8s_version: "v1.33"

# 노드 네트워크와 겹치지 않는 Pod 대역 (Flannel 기본값)
pod_cidr: "10.244.0.0/16"
flannel_manifest: "https://github.com/flannel-io/flannel/releases/latest/download/kube-flannel.yml"

# Preflight 기준값
preflight_min_disk_gb: 15
preflight_cp_ports: [6443, 2379, 2380, 10257, 10259]   # control plane 전용
preflight_node_ports: [10250]                          # 모든 k8s 노드
