# 관리 노드 접속 (Terraform이 만든 VM의 계정과 같아야 함)
ansible_user: orbit
ansible_python_interpreter: /usr/bin/python3

# Kubernetes 마이너 버전 (pkgs.k8s.io 저장소 경로에 들어감)
k8s_version: "v1.33"

# CNI는 Flannel에서 Calico로 전환 (이슈 코멘트 반영). Pod 대역·버전은
# roles/control_plane/defaults/main.yml의 pod_network_cidr / calico_version 참고.

# Preflight 기준값
preflight_min_disk_gb: 15
preflight_cp_ports: [6443, 2379, 2380, 10257, 10259]   # control plane 전용
preflight_node_ports: [10250]                          # 모든 k8s 노드
