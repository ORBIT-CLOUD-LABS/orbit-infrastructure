# 모든 대상의 충돌·해시·기존 SSH/sudo 검사를 통과한 뒤 한 호스트씩 적용
# ansible-playbook playbooks/personal-accounts.yml -K --ask-vault-pass --check
# ansible-playbook playbooks/personal-accounts.yml -K --ask-vault-pass --limit sol
- name: 전체 대상 사전 확인 (변경 없음)
  hosts: all
  become: true
  gather_facts: false
  strategy: linear
  any_errors_fatal: true
  tasks:
    - name: 전체 팀원과 접근 대상 검증
      ansible.builtin.import_role:
        name: personal_accounts
        tasks_from: validate.yml
      run_once: true   # noqa: run-once[task] -- linear로 전체 입력을 한 번만 검사

    - name: 계정 생성 전 모든 대상의 기존 상태 확인
      ansible.builtin.import_role:
        name: personal_accounts
        tasks_from: preflight.yml

- name: 개인 계정과 호스트별 접근 권한
  hosts: all
  become: true
  gather_facts: false
  serial: 1
  any_errors_fatal: true
  roles:
    - personal_accounts
