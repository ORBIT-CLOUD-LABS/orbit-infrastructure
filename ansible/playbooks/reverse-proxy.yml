# astra 내부 리버스 프록시 (nginx). 서비스 이름 → 모니터링 VM 포트. astra 개인 계정으로 실행
# 문서: docs/reverse-proxy.md
#   먼저: ansible-playbook playbooks/network.yml --limit astra   (규칙 저장 도구)
#         ansible-playbook playbooks/fluent-bit.yml -K           (astra에 efk CA 사본)
#   미리보기: ansible-playbook playbooks/reverse-proxy.yml -K --check --diff
#   실행:    ansible-playbook playbooks/reverse-proxy.yml -K --diff
# 비밀값을 쓰지 않으므로 VAULT_TOKEN은 필요 없음

- name: 내부 리버스 프록시 (astra)
  hosts: gateway
  become: true
  roles:
    - reverse_proxy
