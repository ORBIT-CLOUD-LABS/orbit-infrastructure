---
# ORBIT Lab 전체 구성 플레이북 (ansible/ 폴더에서 실행)
# 실행: ansible-playbook playbooks/site.yml                       (inventory/lab/hosts.ini)
#      ansible-playbook -i inventory/test.ini playbooks/site.yml   (테스트 VM)

# 0. 설치 전 점검 (접속, OS, 자원, 중복, 포트, 인터넷)
- name: Preflight
  ansible.builtin.import_playbook: preflight.yml

# 1. 모든 VM 공통 OS 기본 설정 (패키지, 시간, sshd, journald, 자동 업데이트)
- name: Base
  ansible.builtin.import_playbook: base.yml

# 2. k8s 노드 공통: swap, 커널 모듈, containerd, kubelet/kubeadm/kubectl
- name: Kubernetes node
  hosts: k8s
  become: true
  roles:
    - k8s_node

# 3. control plane: kubeadm init + CNI(Calico) + join 명령 생성
- name: Control plane
  hosts: control_plane
  become: true
  roles:
    - k8s_control_plane

# 4. worker: kubeadm join
- name: Workers
  hosts: workers
  become: true
  roles:
    - k8s_worker

# 5. 모든 관리 노드(astra_host 포함): node_exporter (Monitoring VM의 Prometheus가 수집)
- name: Node exporter
  hosts: all
  become: true
  roles:
    - role: node_exporter
      tags: [monitoring, node_exporter]

# (다음 롤은 각 이슈/PR에서 여기에 추가: jenkins, nfs, db, addons)

# 6. 검증: 인벤토리의 모든 k8s 노드가 등록되고 Ready
- name: Verify cluster
  hosts: control_plane
  become: true
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  tasks:
    # nodes --all은 이미 등록된 노드만 보므로 join에 실패한 노드를 놓친다.
    # 인벤토리 이름(= --node-name)으로 하나씩 확인한다. 아직 등록 전이면 wait가 바로 실패하므로 재시도한다.
    - name: 인벤토리의 k8s 노드가 모두 Ready인지 확인
      ansible.builtin.command: kubectl wait --for=condition=Ready node/{{ item }} --timeout=60s
      loop: "{{ groups['k8s'] }}"
      register: node_ready
      until: node_ready.rc == 0
      retries: 5
      delay: 10
      changed_when: false

    - name: kubectl get nodes
      ansible.builtin.command: kubectl get nodes -o wide
      register: nodes_out
      changed_when: false

    - name: 결과 출력
      ansible.builtin.debug:
        var: nodes_out.stdout_lines
