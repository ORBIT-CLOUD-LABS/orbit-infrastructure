# 네트워크: netplan, 워커 장애 전환 감시, astra NAT
#   미리보기: ansible-playbook playbooks/network.yml -K --check --diff --limit <노드>
#   astra 먼저 따로:  --limit astra
#   나머지 한 대씩:   --limit luna  (또는 --limit 'cp,workers' 로 한 대씩 차례로)

- name: 게이트웨이 (astra)
  hosts: gateway
  become: true
  roles:
    - network
    - gateway     # 브리지로 바뀌면 NAT 허용 규칙도 br0 기준으로 바로 바꿈

- name: 나머지 노드
  hosts: cp:workers
  become: true
  serial: 1       # 한 대씩. 실패하면 거기서 멈춤
  roles:
    - network
