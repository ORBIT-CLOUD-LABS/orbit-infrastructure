# Argo CD (클러스터마다 하나, namespace argocd). astra 개인 계정으로 실행
# 문서: docs/argocd.md
#   먼저: ansible-playbook playbooks/cluster.yml (k3s)
#   ../scripts/orbit-ssh-cert.sh                       # SSH 인증서 (8시간)
#   미리보기: ansible-playbook playbooks/argocd.yml -K --check --diff
#   실행:    ansible-playbook playbooks/argocd.yml -K
# 클러스터마다 -1에서 실행. 한 클러스터만: --limit ota_main

- name: Argo CD
  hosts: ota_main[0]:ota_sub[0]:cdn_main[0]:cdn_sub[0]
  become: true
  roles:
    - argocd
