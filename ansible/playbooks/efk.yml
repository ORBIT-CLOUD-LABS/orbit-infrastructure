# Elasticsearch, Kibana (efk VM). astra에서 실행
#   먼저: ansible-playbook playbooks/vms.yml -K --ask-vault-pass  (efk VM)
# 비밀번호와 Kibana 암호화 키는 Vault secret/orbit/infra/efk에 있음. 없는 키는 처음 실행할 때 만들어 저장
#   read -rs VAULT_TOKEN && export VAULT_TOKEN   # 팀원 GitHub 로그인 토큰. 화면과 history에 남지 않게 입력
#   미리보기: ansible-playbook playbooks/efk.yml -K --check --diff
#   실행:    ansible-playbook playbooks/efk.yml -K
#   unset VAULT_TOKEN
# 설정이나 버전이 바뀌면 Elasticsearch와 Kibana가 재시작됨. 그동안 로그 전송은 송신 측 버퍼에 쌓임

- name: Elasticsearch, Kibana (efk)
  hosts: efk
  become: true
  roles:
    - efk

- name: 확인
  hosts: efk
  become: true
  gather_facts: false
  tasks:
    - name: Elasticsearch, Kibana 상태
      ansible.builtin.include_role:
        name: efk
        tasks_from: verify.yml
      when: not ansible_check_mode   # 미리보기에서는 실제로 설치·시작되지 않음
