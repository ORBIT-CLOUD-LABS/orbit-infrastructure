# VM 만들기. 물리 호스트마다 자기 VM(vm_host)만 만듦 (roles/libvirt). 문서: docs/vms.md
#   먼저: 물리 호스트 네트워크 (br0, astra 바깥 브리지)
#   vault.yml(VM orbit 계정의 sudo 비밀번호 해시)이 필요해서 astra의 orbit 계정으로 실행
#   만들 VM은 -e vm_pattern=<인벤토리 패턴>으로 정함 (필수)
#     fw 쌍:      -e vm_pattern=fw
#     나머지 VM:  -e 'vm_pattern=vms:!obs'   (방화벽 게이트웨이 VIP가 생긴 뒤. 관측 VM은 따로)
#   미리보기: ansible-playbook playbooks/vms.yml -K --ask-vault-pass --private-key ~/.ssh/orbit_ansible -e vm_pattern=fw --check --limit vm_hosts
#            (--limit vm_hosts: 아직 없는 VM에 접속하지 않게. 만들 VM 고르기는 --limit과 상관없이 vm_pattern으로)
#   실행:    ansible-playbook playbooks/vms.yml -K --ask-vault-pass --private-key ~/.ssh/orbit_ansible -e vm_pattern=fw
# 이미 있는 VM은 다시 만들지 않음 (사양 변경은 아직 수동)

- name: VM 만들기 (물리 호스트)
  hosts: vm_hosts
  become: true
  roles:
    - libvirt

- name: VM 접속 확인
  hosts: "{{ vm_pattern | default('vm_pattern_not_set') }}"  # 없으면 첫 play의 확인(libvirt role)에서 멈춤
  gather_facts: false
  tasks:
    - name: SSH 될 때까지 대기 (첫 부팅은 cloud-init 때문에 몇 분 걸림)
      ansible.builtin.wait_for_connection:
        timeout: 600

    - name: 확인
      ansible.builtin.command: hostnamectl --static
      changed_when: false
      register: vm_hostname

    - name: 이름 확인
      ansible.builtin.assert:
        that: vm_hostname.stdout == inventory_hostname

# 이번에 만든 VM과 물리 호스트만. 아직 만들지 않은 VM은 접속이 안 되므로 넣지 않음
# 대상이 전체가 아니라서 astra의 호스트 키 목록(ssh_known_hosts)은 그대로 둠 (base role)
- name: 이름으로 찾기 (/etc/hosts). VM이 새로 생겼으니 물리 호스트와 VM 모두
  hosts: "vm_hosts:{{ vm_pattern | default('vm_pattern_not_set') }}"
  become: true
  roles:
    - base
