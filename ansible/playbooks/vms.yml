# 모니터링 VM 3대 (efk, lgtm, wazuh)를 astra에 만들기
#   먼저: ansible-playbook playbooks/network.yml --limit astra  (br0)
#   실행: ansible-playbook playbooks/vms.yml -K --ask-vault-pass
# 이미 있는 VM은 다시 만들지 않음 (사양 변경은 아직 수동)

- name: VM 만들기 (astra)
  hosts: gateway
  become: true
  roles:
    - libvirt

- name: VM 접속 확인
  hosts: monitoring
  gather_facts: false
  tasks:
    - name: SSH 될 때까지 대기 (첫 부팅은 cloud-init 때문에 몇 분 걸림)
      ansible.builtin.wait_for_connection:
        timeout: 600

    - name: 확인
      ansible.builtin.command: hostnamectl --static
      changed_when: false
      register: vm_hostname

    - name: 이름 확인
      ansible.builtin.assert:
        that: vm_hostname.stdout == inventory_hostname

- name: 이름으로 찾기 (/etc/hosts). VM이 새로 생겼으니 노드와 VM 모두
  hosts: all
  become: true
  roles:
    - base
