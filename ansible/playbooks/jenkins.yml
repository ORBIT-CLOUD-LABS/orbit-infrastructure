---
- name: Configure Jenkins controller and Terraform runner
  hosts: jenkins
  become: true

  # group_vars는 inventory 파일(inventory/lab/)이나 playbook(playbooks/) 옆에 있어야
  # 자동으로 읽힌다. ansible/group_vars는 둘 다 아니라서 명시적으로 로드한다.
  vars_files:
    - ../group_vars/jenkins/vars.yml
    - ../group_vars/jenkins/vault.yml

  roles:
    - base
    - jenkins
    - terraform_runner
