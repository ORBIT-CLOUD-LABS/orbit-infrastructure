# 물리 호스트: KVM, libvirt, 자기 VM 만들기
# 만들 VM은 vm_pattern(인벤토리 패턴, 예: fw, 'vms:!obs')에 들고 vm_host가 이 호스트인 것만
- name: 만들 VM을 정했는지 (-e vm_pattern=...)
  ansible.builtin.assert:
    that: vm_pattern is defined and vm_pattern | length > 0
    fail_msg: "만들 VM을 -e vm_pattern=<인벤토리 패턴>으로 정해야 함. 예: fw, 'vms:!obs' (playbooks/vms.yml 머리말)"
    quiet: true

- name: 이 호스트에 만들 VM 고르기
  ansible.builtin.set_fact:
    vm_list: >-
      {{ query('ansible.builtin.inventory_hostnames', vm_pattern) | map('extract', hostvars)
         | selectattr('vm_host', 'defined') | selectattr('vm_host', 'equalto', inventory_hostname)
         | map(attribute='inventory_hostname') | list }}

- name: 만들 VM
  ansible.builtin.debug:
    var: vm_list

- name: 만들 VM이 없으면 이 호스트는 건너뜀 (KVM도 설치하지 않음)
  ansible.builtin.meta: end_host
  when: vm_list | length == 0

- name: 브리지가 있어야 함 (물리 호스트 네트워크를 먼저)
  ansible.builtin.assert:
    that: vm_bridge in ansible_facts.interfaces
    fail_msg: "{{ vm_bridge }} 없음. 먼저 ansible-playbook playbooks/network.yml --limit {{ inventory_hostname }}"

- name: 바깥 NIC가 있는 VM(fw)을 만들면 바깥 브리지도 있어야 함
  ansible.builtin.assert:
    that: vm_outer_bridge | length > 0 and vm_outer_bridge in ansible_facts.interfaces
    fail_msg: "바깥 브리지({{ vm_outer_bridge | default('정하지 않음', true) }}) 없음. astra의 outer_bridge와 network 플레이북 확인"
  when: vm_list | map('extract', hostvars) | selectattr('outer_mac', 'defined') | list | length > 0

- name: 가상화 지원 확인 (/dev/kvm)
  ansible.builtin.stat:
    path: /dev/kvm
  register: kvm_dev

- name: /dev/kvm 없으면 멈춤 (BIOS에서 VT-x 켜기)
  ansible.builtin.assert:
    that: kvm_dev.stat.exists
    fail_msg: "/dev/kvm 없음. BIOS에서 Intel VT-x(가상화)를 켜야 함"

- name: KVM, libvirt, 이미지 도구 설치
  ansible.builtin.apt:
    name: [qemu-kvm, libvirt-daemon-system, libvirt-clients, virtinst, qemu-utils, cloud-image-utils]
    state: present
    install_recommends: false
    update_cache: true
    cache_valid_time: 3600

- name: libvirtd 켜기
  ansible.builtin.systemd_service:
    name: libvirtd
    enabled: true
    state: started
  when: not ansible_check_mode   # 미리보기에서는 위 설치가 실제로 안 돼서 서비스가 아직 없음

- name: machine.slice 설정 폴더
  ansible.builtin.file:
    path: /etc/systemd/system/machine.slice.d
    state: directory
    mode: "0755"

- name: VM CPU 우선순위 낮추기 (경쟁할 때 nginx, Vault, NAT가 먼저)
  ansible.builtin.copy:
    dest: /etc/systemd/system/machine.slice.d/50-orbit-cpu.conf
    content: |
      # Ansible managed (roles/libvirt)
      [Slice]
      CPUWeight={{ vm_cpu_weight }}
    mode: "0644"
  notify: reload systemd

- name: 폴더
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0711"
  loop: ["{{ vm_dir }}", "{{ vm_dir }}/base", "{{ vm_dir }}/seed"]

- name: Ubuntu 24.04 클라우드 이미지 받기 (체크섬 확인)
  ansible.builtin.get_url:
    url: "{{ vm_image_url }}"
    dest: "{{ vm_base_image }}"
    checksum: "sha256:{{ vm_image_sums }}"
    mode: "0644"
    force: false     # 이미 있으면 다시 받지 않음

- name: virt-install이 아는 OS 목록
  ansible.builtin.command: virt-install --osinfo list
  register: osinfo_list
  changed_when: false
  failed_when: false    # 미리보기에서는 아직 설치 전일 수 있음
  check_mode: false

- name: OS 종류 정하기 (ubuntu24.04를 모르면 linux2022)
  ansible.builtin.set_fact:
    vm_os_variant_used: >-
      {{ vm_os_variant if (osinfo_list.rc == 0 and osinfo_list.stdout | regex_search('(^|[ ,])' ~ (vm_os_variant | regex_escape) ~ '([ ,]|$)', multiline=True))
         else 'linux2022' }}

- name: Ansible 공개키 읽기
  ansible.builtin.set_fact:
    vm_ssh_pubkey: "{{ lookup('file', vm_ssh_pubkey_file) }}"

- name: VM 만들기
  ansible.builtin.include_tasks: vm.yml
  loop: "{{ vm_list }}"
  loop_control:
    loop_var: vm_name
  vars:
    vm: "{{ hostvars[vm_name] }}"   # 그 VM의 인벤토리 값. set_fact로 담으면 ansible-core 2.19부터 hostvars를 못 읽어 실패
