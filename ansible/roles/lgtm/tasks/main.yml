# lgtm: Prometheus, Alertmanager, Grafana. node-exporter는 node-exporter.yml (플레이북이 4대에 먼저 적용)
# 서비스보다 먼저. 처음 설치할 때도 3000·9090·9093이 허용한 곳에만 열림
- name: 방화벽
  ansible.builtin.include_tasks: firewall.yml

- name: 비밀값 (Vault)
  ansible.builtin.include_tasks: secrets.yml

- name: Prometheus, Alertmanager
  ansible.builtin.include_tasks: prometheus.yml

- name: Grafana
  ansible.builtin.include_tasks: grafana.yml