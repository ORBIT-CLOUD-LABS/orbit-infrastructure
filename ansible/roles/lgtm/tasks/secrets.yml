# 비밀값. Grafana 관리자 비밀번호는 Vault에 없으면 만들어 저장하고, Elasticsearch 조회 계정은 efk role이 만든 값을 읽기만 함
# Vault API는 astra에서 호출. 토큰은 실행하는 쪽의 환경 변수에서 읽음 (팀원 GitHub 로그인 토큰으로 충분)
- name: VAULT_TOKEN이 있어야 함
  ansible.builtin.assert:
    that: lookup('ansible.builtin.env', 'VAULT_TOKEN') | length > 0
    fail_msg: >-
      VAULT_TOKEN이 없음. Grafana 관리자 비밀번호를 Vault({{ hvault_kv_mount }}/{{ lgtm_vault_path }})에서 읽어야 함.
      ../scripts/orbit-ssh-cert.sh 후 export VAULT_TOKEN=$(cat ~/.orbit/vault-token)
    quiet: true

# efk role의 공용 단계를 그대로 씀: 한 경로를 읽고 없는 키만 무작위 값으로 만들어 저장
- name: Grafana 관리자 비밀번호 ({{ lgtm_vault_path }})
  ansible.builtin.include_role:
    name: efk
    tasks_from: vault-secret.yml
  vars:
    efk_vs_path: "{{ lgtm_vault_path }}"
    efk_vs_keys: "{{ lgtm_secret_keys }}"

# 미리보기에서 새로 만든 값은 Vault에 없으므로 Grafana 설정을 건너뜀
- name: 관리자 비밀번호 값
  ansible.builtin.set_fact:
    lgtm_secrets: "{{ efk_vs_values }}"
    lgtm_secrets_ready: "{{ efk_vs_ready }}"
  no_log: true

- name: Elasticsearch 조회 계정 비밀번호 읽기 ({{ lgtm_efk_vault_path }})
  ansible.builtin.uri:
    url: "{{ hvault_addr }}/v1/{{ hvault_kv_mount }}/data/{{ lgtm_efk_vault_path }}"
    headers:
      X-Vault-Token: "{{ lookup('ansible.builtin.env', 'VAULT_TOKEN') }}"
    ca_path: "{{ hvault_tls_dir }}/vault-ca.crt"
    status_code: [200, 403, 404, 503]
  delegate_to: "{{ hvault_host }}"
  become: false
  check_mode: false   # 읽기만 함
  register: lgtm_efk_vault_read
  no_log: true

- name: 읽혀야 함
  ansible.builtin.assert:
    that:
      - lgtm_efk_vault_read.status == 200
      - lgtm_efk_vault_key in lgtm_efk_vault_read.json.data.data
    fail_msg: >-
      {{ 'Vault가 sealed 상태. 먼저 unseal' if lgtm_efk_vault_read.status == 503
         else ('Vault ' ~ hvault_kv_mount ~ '/' ~ lgtm_efk_vault_path ~ '의 ' ~ lgtm_efk_vault_key ~ '를 읽지 못함 ('
               ~ lgtm_efk_vault_read.status ~ '). 토큰 만료나 권한, 또는 efk 플레이북을 먼저 실행했는지 확인') }}
    quiet: true

- name: Elasticsearch 검증용 CA가 있어야 함 (fluent_bit role이 둠)
  ansible.builtin.slurp:
    src: "{{ lgtm_efk_ca }}"
  register: lgtm_efk_ca_read

- name: 쓸 값
  ansible.builtin.set_fact:
    lgtm_efk_password: "{{ lgtm_efk_vault_read.json.data.data[lgtm_efk_vault_key] }}"
    lgtm_efk_ca_pem: "{{ lgtm_efk_ca_read.content | b64decode }}"
  no_log: true
