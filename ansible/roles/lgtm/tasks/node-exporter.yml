# node-exporter (astra, 모니터링 VM 3대). 호스트 지표를 9100으로 내놓고 lgtm의 Prometheus가 긁어 감
# 방화벽을 먼저. 처음 설치할 때도 9100이 lgtm에만 열림
- name: 방화벽
  ansible.builtin.include_tasks: firewall.yml

# astra에는 10/15(Phase 1)에 같은 패키지와 추가 수집기가 이미 있음. 지우지 않고 이 role이 넘겨받음 (설정 파일을 다시 씀)
# 추가 수집기는 smartmontools 등을 같이 가져옴. smartmontools는 호스트 Fluent Bit이 로그를 수집하므로 지우지 않음
- name: node-exporter 설치 (astra는 추가 수집기도)
  ansible.builtin.apt:
    name: >-
      {{ ['prometheus-node-exporter']
         + (['prometheus-node-exporter-collectors'] if inventory_hostname in lgtm_node_exporter_collectors_hosts else []) }}
    state: present
    install_recommends: false   # 추천 패키지인 추가 수집기가 VM에 따라 깔리지 않게. astra는 위 목록에 직접 넣음
    update_cache: true
    cache_valid_time: 3600

- name: apt upgrade로 버전이 바뀌지 않게 고정
  ansible.builtin.dpkg_selections:
    name: prometheus-node-exporter
    selection: hold
  when: not ansible_check_mode   # 미리보기 첫 실행에서는 아직 설치되지 않음

# 내부망 주소에만 붙임. astra는 와이파이에도 붙어 있음
- name: 받는 주소
  ansible.builtin.copy:
    content: |
      # Ansible managed (roles/lgtm)
      ARGS="--web.listen-address={{ lan_ip }}:{{ lgtm_node_exporter_port }}"
    dest: /etc/default/prometheus-node-exporter
    owner: root
    group: root
    mode: "0644"
  notify: restart node-exporter

# 주소를 정해 붙이므로 재부팅할 때 내부망 주소가 잡힌 뒤에 시작해야 함
- name: 시작 순서 폴더
  ansible.builtin.file:
    path: /etc/systemd/system/prometheus-node-exporter.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: 폴더가 있는지 (미리보기 첫 실행에서는 아직 없음)
  ansible.builtin.stat:
    path: /etc/systemd/system/prometheus-node-exporter.service.d
  register: lgtm_ne_dropin_dir

- name: 시작 순서 (네트워크가 준비된 뒤)
  when: lgtm_ne_dropin_dir.stat.exists
  ansible.builtin.copy:
    content: |
      # Ansible managed (roles/lgtm)
      [Unit]
      After=network-online.target
      Wants=network-online.target
    dest: /etc/systemd/system/prometheus-node-exporter.service.d/orbit.conf
    owner: root
    group: root
    mode: "0644"
  notify: restart node-exporter

- name: node-exporter 켜기
  ansible.builtin.systemd_service:
    name: prometheus-node-exporter
    enabled: true
    state: started
    daemon_reload: true
  when: not ansible_check_mode
