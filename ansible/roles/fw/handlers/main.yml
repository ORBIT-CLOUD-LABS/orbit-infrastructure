- name: apply sysctl
  ansible.builtin.command: sysctl --system
  changed_when: true

# 파일 첫 줄의 flush ruleset으로 전체를 바꿈. 한 번에 적용돼서 바꾸는 사이에 열리는 순간이 없음
- name: reload nftables
  ansible.builtin.systemd_service:
    name: nftables
    state: reloaded
  when: not ansible_check_mode

- name: restart conntrackd
  ansible.builtin.systemd_service:
    name: conntrackd
    state: restarted
  when: not ansible_check_mode

- name: restart keepalived
  ansible.builtin.systemd_service:
    name: keepalived
    state: restarted
  when: not ansible_check_mode
