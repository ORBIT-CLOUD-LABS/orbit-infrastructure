# 쓰기 계정 비밀번호는 Vault(efk role이 만든 값)에서 읽기만 함. CA는 efk에서 가져옴
- name: VAULT_TOKEN이 있어야 함
  ansible.builtin.assert:
    that: lookup('ansible.builtin.env', 'VAULT_TOKEN') | length > 0
    fail_msg: >-
      VAULT_TOKEN이 없음. 쓰기 계정 비밀번호를 Vault({{ hvault_kv_mount }}/{{ fluentbit_vault_path }})에서 읽어야 함.
      ../scripts/orbit-ssh-cert.sh 후 export VAULT_TOKEN=$(cat ~/.orbit/vault-token)
    quiet: true

- name: Vault에서 쓰기 계정 비밀번호 읽기
  ansible.builtin.uri:
    url: "{{ hvault_addr }}/v1/{{ hvault_kv_mount }}/data/{{ fluentbit_vault_path }}"
    headers:
      X-Vault-Token: "{{ lookup('ansible.builtin.env', 'VAULT_TOKEN') }}"
    ca_path: "{{ hvault_tls_dir }}/vault-ca.crt"
    status_code: [200, 403, 404, 503]
  delegate_to: "{{ hvault_host }}"
  become: false
  run_once: true
  check_mode: false   # 읽기만 함
  register: fluentbit_vault_read
  no_log: true

- name: 읽혀야 함
  ansible.builtin.assert:
    that:
      - fluentbit_vault_read.status == 200
      - fluentbit_vault_key in fluentbit_vault_read.json.data.data
      - fluentbit_check_key in fluentbit_vault_read.json.data.data
    fail_msg: >-
      {{ 'Vault가 sealed 상태. 먼저 unseal' if fluentbit_vault_read.status == 503
         else ('Vault ' ~ hvault_kv_mount ~ '/' ~ fluentbit_vault_path ~ '의 ' ~ fluentbit_vault_key ~ '를 읽지 못함 ('
               ~ fluentbit_vault_read.status ~ '). 토큰 만료나 권한, 또는 efk 플레이북을 먼저 실행했는지 확인') }}
    quiet: true
  run_once: true

- name: efk의 CA 인증서 읽기
  ansible.builtin.slurp:
    src: "{{ fluentbit_ca_src }}"
  delegate_to: efk
  run_once: true
  register: fluentbit_ca_read

- name: 쓸 값
  ansible.builtin.set_fact:
    fluentbit_es_password: "{{ fluentbit_vault_read.json.data.data[fluentbit_vault_key] }}"
    # 확인 단계에서 들어온 로그를 셀 때 쓰는 조회 계정 (읽기만 됨)
    fluentbit_check_password: "{{ fluentbit_vault_read.json.data.data[fluentbit_check_key] }}"
    fluentbit_ca_pem: "{{ fluentbit_ca_read.content | b64decode }}"
  no_log: true
