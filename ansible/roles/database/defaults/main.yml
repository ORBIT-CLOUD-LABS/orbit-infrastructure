---
# 데이터 디스크 (Terraform이 붙인 libvirt volume). 비우면 루트 디스크 사용
db_data_device: ""
db_data_mount: /srv/db-data

# DB / 계정
db_name: orbit
db_app_user: orbit_app
db_app_password: ""                 # vault로 주입 (8자 이상)
db_allowed_hosts: ["192.168.100.%"] # 앱 계정 접속 허용 대역 (MySQL host 패턴)
# 앱 계정 권한 (서비스 DB 한정). 서버가 기동할 때마다 Flyway migration을 실행하므로
# DML에 더해 DDL(CREATE, ALTER, INDEX, DROP, REFERENCES)이 필요하다.
# MySQL은 뷰 생성을 CREATE와 별도인 CREATE VIEW 권한으로 다룬다
# (orbit-server V2__create_vehicle_status_view.sql이 뷰를 만든다)
db_app_privileges: "SELECT,INSERT,UPDATE,DELETE,CREATE,CREATE VIEW,ALTER,INDEX,DROP,REFERENCES"

# MySQL 설정
db_bind_address: "0.0.0.0"
db_port: 3306
db_max_connections: 200
db_innodb_buffer_pool_size: 512M

# 앱 연결 수 예산 (검증에서 max_connections와 비교)
# 필요 연결 = pool × (최대 replica + 롤링 업데이트 중 추가 파드) + 운영 여유
db_app_pool_size: 10                # 앱 파드당 커넥션 pool 최대 크기 (Hikari 기본값 10)
db_app_max_replicas: 1
db_app_surge_replicas: 1
db_reserved_connections: 20         # 운영자·모니터링·백업 접속 몫
# 앱이 접속해 오는 인벤토리 그룹. 검증 때 이 그룹의 각 호스트에서 3306 접속을 확인한다 (비우면 생략)
db_app_client_group: ""

# 백업
db_backup_dir: /var/backups/mysql   # 데이터 디스크와 다른 디스크에 둔다
db_backup_retention_days: 7
db_backup_hour: 3                   # 매일 03:xx

# 검증(연결 수 예산·DB 설정·권한·앱 출발지 포트 + 백업 1회)을 실행할지: -e db_verify=true
db_verify: false
