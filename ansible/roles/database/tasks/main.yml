---
- name: 앱 계정 비밀번호가 있어야 함 (vault 또는 -e)
  ansible.builtin.assert:
    that: db_app_password | length >= 8
    fail_msg: >-
      db_app_password가 비어 있거나 8자 미만입니다.
      secrets/vault.yml(ansible-vault)에 값을 넣거나, 테스트라면 -e db_app_password=... 로 실행하세요.
    quiet: true

# ── 1. 데이터 경로 ─────────────────────────────────────────────
# 데이터 디스크를 /srv/db-data에 마운트하고, 그 안의 mysql 폴더를 /var/lib/mysql에 bind mount.
# MySQL 설치 "전에" 해야 빈 폴더에 DB가 초기화된다.
- name: 데이터 디스크 마운트
  ansible.builtin.import_role:
    name: data_disk
  vars:
    data_disk_device: "{{ db_data_device }}"
    data_disk_mount: "{{ db_data_mount }}"
    data_disk_var_name: db_data_device

- name: 데이터 디스크 위에 MySQL 데이터 경로 연결
  when: db_data_device | length > 0
  block:
    - name: 디스크 안 mysql 폴더
      ansible.builtin.file:
        path: "{{ db_data_mount }}/mysql"
        state: directory
        mode: "0750"

    - name: /var/lib/mysql 마운트 지점
      ansible.builtin.file:
        path: /var/lib/mysql
        state: directory
        mode: "0750"

    - name: bind mount ({{ db_data_mount }}/mysql → /var/lib/mysql)
      ansible.posix.mount:
        path: /var/lib/mysql
        src: "{{ db_data_mount }}/mysql"
        fstype: none
        opts: bind,nofail
        state: mounted

# ── 2. 설치 ───────────────────────────────────────────────────
- name: MySQL 설치
  ansible.builtin.apt:
    name: [mysql-server, python3-pymysql]
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: 이전 설정 파일 제거 (이름 변경 전 99-orbit.cnf)
  ansible.builtin.file:
    path: /etc/mysql/mysql.conf.d/99-orbit.cnf
    state: absent
  notify: restart mysql

- name: MySQL 설정 (외부 접속, 자원)
  ansible.builtin.template:
    src: 99-orbit.cnf.j2
    dest: /etc/mysql/mysql.conf.d/zz-orbit.cnf
    mode: "0644"
  notify: restart mysql

- name: MySQL 실행
  ansible.builtin.systemd:
    name: mysql
    state: started
    enabled: true

- name: 설정 변경 즉시 반영
  ansible.builtin.meta: flush_handlers

# ── 3. 접근 제어 ──────────────────────────────────────────────
- name: 익명 계정 제거
  community.mysql.mysql_user:
    name: ""
    host_all: true
    state: absent
    login_unix_socket: /run/mysqld/mysqld.sock

- name: test DB 제거
  community.mysql.mysql_db:
    name: test
    state: absent
    login_unix_socket: /run/mysqld/mysqld.sock

- name: 서비스 DB 생성
  community.mysql.mysql_db:
    name: "{{ db_name }}"
    encoding: utf8mb4
    collation: utf8mb4_unicode_ci
    state: present
    login_unix_socket: /run/mysqld/mysqld.sock

- name: 앱 계정 (허용 대역에서만, 서비스 DB 권한만)
  community.mysql.mysql_user:
    name: "{{ db_app_user }}"
    host: "{{ item }}"
    password: "{{ db_app_password }}"
    priv: "{{ db_name }}.*:{{ db_app_privileges }}"
    state: present
    login_unix_socket: /run/mysqld/mysqld.sock
  loop: "{{ db_allowed_hosts }}"
  no_log: true

- name: 앱 계정의 현재 접속 host 목록
  community.mysql.mysql_query:
    query: SELECT Host FROM mysql.user WHERE User = %s
    positional_args: ["{{ db_app_user }}"]
    login_unix_socket: /run/mysqld/mysqld.sock
  register: db_app_user_hosts
  changed_when: false

- name: 허용 목록에서 빠진 host의 앱 계정 제거
  community.mysql.mysql_user:
    name: "{{ db_app_user }}"
    host: "{{ item }}"
    state: absent
    login_unix_socket: /run/mysqld/mysqld.sock
  loop: >-
    {{ db_app_user_hosts.query_result[0] | map(attribute='Host')
       | difference(db_allowed_hosts) }}

# ── 4. 백업 / 복구 ────────────────────────────────────────────
- name: 백업 폴더
  ansible.builtin.file:
    path: "{{ db_backup_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: 백업 / 복구 스크립트
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/usr/local/sbin/{{ item }}"
    mode: "0750"
  loop: [orbit-db-backup, orbit-db-restore]

- name: 매일 백업 (cron)
  ansible.builtin.cron:
    name: orbit-db-backup
    cron_file: orbit-db-backup
    user: root
    minute: "17"
    hour: "{{ db_backup_hour }}"
    job: /usr/local/sbin/orbit-db-backup >> /var/log/orbit-db-backup.log 2>&1

# ── 5. 검증 (-e db_verify=true 로 실행할 때만) ─────────────────
- name: 검증
  when: db_verify | bool
  block:
    # 앱 계정 로그인은 실제 출발지(Pod → worker SNAT)에서 확인한다 (docs/vehicle-db.md).
    # DB VM 자신은 허용 목록에 없으므로 여기서는 로그인하지 않는다.
    - name: max_connections 조회
      community.mysql.mysql_query:
        query: SELECT @@GLOBAL.max_connections AS max_connections
        login_unix_socket: /run/mysqld/mysqld.sock
      register: db_max_conn
      changed_when: false

    - name: 앱 최대 연결 수가 max_connections 안에 들어와야 함
      vars:
        db_required_connections: >-
          {{ db_app_pool_size * (db_app_max_replicas + db_app_surge_replicas)
             + db_reserved_connections }}
      ansible.builtin.assert:
        that: db_max_conn.query_result[0][0].max_connections | int >= db_required_connections | int
        fail_msg: >-
          필요 연결 {{ db_required_connections }}
          (pool {{ db_app_pool_size }} × replica {{ db_app_max_replicas }}+{{ db_app_surge_replicas }}
          + 여유 {{ db_reserved_connections }})이
          max_connections {{ db_max_conn.query_result[0][0].max_connections }}를 넘습니다.
        success_msg: >-
          필요 연결 {{ db_required_connections }} ≤
          max_connections {{ db_max_conn.query_result[0][0].max_connections }}

    - name: 서비스 DB 문자셋·collation 조회
      community.mysql.mysql_query:
        query: >-
          SELECT DEFAULT_CHARACTER_SET_NAME AS charset, DEFAULT_COLLATION_NAME AS collation
          FROM information_schema.SCHEMATA WHERE SCHEMA_NAME = %s
        positional_args: ["{{ db_name }}"]
        login_unix_socket: /run/mysqld/mysqld.sock
      register: db_schema
      changed_when: false

    - name: 앱 계정 권한 조회
      community.mysql.mysql_query:
        query: SHOW GRANTS FOR %s@%s
        positional_args: ["{{ db_app_user }}", "{{ item }}"]
        login_unix_socket: /run/mysqld/mysqld.sock
      loop: "{{ db_allowed_hosts }}"
      register: db_grants
      changed_when: false

    - name: 앱 출발지에서 DB 포트 접속 확인
      ansible.builtin.wait_for:
        host: "{{ ansible_host }}"
        port: "{{ db_port }}"
        timeout: 5
      delegate_to: "{{ item }}"
      become: false
      loop: "{{ groups[db_app_client_group] | default([]) if db_app_client_group else [] }}"

    - name: 백업 1회 실행
      ansible.builtin.command: /usr/local/sbin/orbit-db-backup
      register: backup_run

    - name: 백업 파일 확인
      ansible.builtin.find:
        paths: "{{ db_backup_dir }}"
        patterns: "{{ db_name }}-*.sql.gz"
        size: 1
      register: backups

    - name: 백업 파일이 있어야 함
      ansible.builtin.assert:
        that: backups.matched > 0
        fail_msg: "백업 파일이 생성되지 않았습니다: {{ backup_run.stdout }}"

    - name: 데이터 경로 출력
      ansible.builtin.command: df -h /var/lib/mysql
      register: df_out
      changed_when: false

    - name: 결과
      ansible.builtin.debug:
        msg:
          - "DB: {{ db_name }} ({{ db_schema.query_result[0][0].charset }} / {{ db_schema.query_result[0][0].collation }})"
          - "권한: {{ db_grants.results | map(attribute='query_result') | flatten | map('dict2items') | flatten | map(attribute='value') | list }}"
          - "데이터: {{ df_out.stdout_lines[-1] }}"
          - "최신 백업: {{ (backups.files | sort(attribute='mtime') | last).path }}"
