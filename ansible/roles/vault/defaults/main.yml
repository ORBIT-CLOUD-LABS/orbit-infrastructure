hvault_repo_url: https://apt.releases.hashicorp.com
hvault_config_dir: /etc/vault.d
hvault_data_dir: /opt/vault/data          # Raft. astra NVMe
hvault_cluster_addr: 127.0.0.1:8201       # 단일 노드라 밖으로 열 필요 없음
hvault_tls_ca_days: 3650
hvault_tls_cert_days: 825
hvault_audit_log: /var/log/vault/audit.log
hvault_audit_maxsize: 100M
hvault_audit_keep: 14
hvault_ssh_policy: ssh-orbit              # SSH 인증서 서명만 허용
# Vault 2.x는 generate-root에 인증이 필요함. root token이 없을 때 관리자 권한을 되찾으려면
# -e hvault_allow_generate_root=true로 잠시 켬 (재시작되어 sealed). API에 닿는 누구나 절차를 시작할 수 있어서 평소에는 끔
hvault_allow_generate_root: false
hvault_tls_sans: >-
  {{ ['DNS:' ~ inventory_hostname, 'DNS:localhost', 'IP:127.0.0.1', 'IP:' ~ lan_ip]
     + (['IP:' ~ tailscale_ip] if tailscale_ip is defined else []) }}

# Raft 스냅샷 S3 백업 (#11). 버킷·접두사 등 프로젝트 값은 group_vars/all/hashicorp-vault.yml
hvault_snapshot_bin: /usr/local/bin/vault-snapshot.sh
hvault_snapshot_restore_bin: /usr/local/bin/vault-snapshot-restore.sh
hvault_snapshot_work_dir: /var/lib/vault-snapshot     # root 0700. 업로드 성공 후 비움
hvault_snapshot_aws_env: /etc/vault.d/snapshot-aws.env
hvault_snapshot_approle_env: /etc/vault.d/snapshot-approle.env
hvault_snapshot_oncalendar: "*-*-* 18:30:00 UTC"      # KST 03:30. 타임존 변경에 흔들리지 않게 UTC로 고정
# 스냅샷이 이보다 작으면 올리지 않고 실패한다. 빈 백업이 쌓이는 쪽이 더 위험하다
# gzip tar 헤더만 있어도 수십 바이트는 나오므로 "0바이트 아님"으로는 부족하다
hvault_snapshot_min_bytes: 4096
# node-exporter textfile collector 폴더. 있으면 성공·실패를 지표로 남긴다 (없으면 아무 일도 안 함)
hvault_snapshot_metric_dir: /var/lib/node_exporter/textfile_collector
