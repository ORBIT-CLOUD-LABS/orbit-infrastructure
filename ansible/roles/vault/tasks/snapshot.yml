# Raft 스냅샷 S3 백업: 파일과 systemd 유닛. Vault 안의 설정(정책·AppRole)은 configure.yml
# 타이머는 AppRole 자격증명이 생긴 뒤에 켠다 (snapshot-approle.yml). 여기서는 켜지 않는다
#
# aws/jq는 배포판 패키지를 쓴다. 스크립트가 쓰는 것은
# s3api put-object / head-object / get-object / list-objects-v2 뿐이고 awscli 1.x·2.x에 모두 있다
- name: 스냅샷 백업에 필요한 패키지
  ansible.builtin.apt:
    name: [awscli, jq]
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: 스냅샷 작업 폴더 (root만)
  ansible.builtin.file:
    path: "{{ hvault_snapshot_work_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0700"

# 암호화된 vault.yml에 키가 없으면 빈 값이 파일에 들어간다. 그 상태로 타이머가 돌면
# 매일 조용히 실패하므로 여기서 멈춘다
- name: AWS 백업 키가 ansible-vault에 있는지
  ansible.builtin.assert:
    that:
      - vault_snapshot_aws_access_key_id | default('') | length > 0
      - vault_snapshot_aws_secret_access_key | default('') | length > 0
    fail_msg: >-
      vault_snapshot_aws_access_key_id / vault_snapshot_aws_secret_access_key가 없음.
      inventory/group_vars/all/vault.yml (ansible-vault)에 넣고 --ask-vault-pass로 실행

- name: AWS 자격증명 (root만 읽음)
  ansible.builtin.template:
    src: snapshot-aws.env.j2
    dest: "{{ hvault_snapshot_aws_env }}"
    owner: root
    group: root
    mode: "0600"
  no_log: true   # 평문 키가 diff와 로그에 남지 않게

- name: 백업 스크립트
  ansible.builtin.template:
    src: vault-snapshot.sh.j2
    dest: "{{ hvault_snapshot_bin }}"
    owner: root
    group: root
    mode: "0750"

- name: 복원 스크립트 (사람이 직접 실행. 타이머가 쓰지 않음)
  ansible.builtin.template:
    src: vault-snapshot-restore.sh.j2
    dest: "{{ hvault_snapshot_restore_bin }}"
    owner: root
    group: root
    mode: "0750"

- name: systemd service
  ansible.builtin.template:
    src: vault-snapshot.service.j2
    dest: /etc/systemd/system/vault-snapshot.service
    owner: root
    group: root
    mode: "0644"
  notify: reload systemd for vault snapshot

- name: systemd timer
  ansible.builtin.template:
    src: vault-snapshot.timer.j2
    dest: /etc/systemd/system/vault-snapshot.timer
    owner: root
    group: root
    mode: "0644"
  notify: reload systemd for vault snapshot

- name: 유닛 파일을 먼저 읽게 함
  ansible.builtin.meta: flush_handlers

# AppRole 자격증명이 아직 없으면 타이머를 켜지 않는다.
# 켜 두면 매일 "role_id 없음"으로 실패하고, 그 실패를 아무도 안 본다
- name: AppRole 자격증명 파일이 있는지
  ansible.builtin.stat:
    path: "{{ hvault_snapshot_approle_env }}"
  register: hvault_snapshot_creds

- name: 자격증명이 없으면 할 일을 알려 줌
  ansible.builtin.debug:
    msg: >-
      {{ hvault_snapshot_approle_env }}가 없어 타이머를 켜지 않았다.
      root token을 넣고 playbooks/vault.yml을 다시 실행하면 configure.yml이 AppRole을 만들고 타이머를 켠다
  when: not hvault_snapshot_creds.stat.exists
