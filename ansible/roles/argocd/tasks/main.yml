---
- name: Bootstrap은 실제 실행으로 검증
  ansible.builtin.assert:
    that: not ansible_check_mode
    fail_msg: 최초 Helm 설치와 Ready 검증은 --check를 지원하지 않습니다. 테스트 클러스터에서 실제 실행하세요.

- name: 설치 버전과 실행 환경 확인
  ansible.builtin.assert:
    that:
      - ansible_facts['system'] == 'Linux'
      - ansible_facts['architecture'] in argocd_helm_architectures
      - argocd_helm_version is match('^v[0-9]+\.[0-9]+\.[0-9]+$')
      - argocd_chart_version is match('^[0-9]+\.[0-9]+\.[0-9]+$')
      - argocd_version is match('^v[0-9]+\.[0-9]+\.[0-9]+$')
    fail_msg: 지원하는 Linux 아키텍처와 정확한 Helm·chart·Argo CD 버전을 지정하세요.

- name: Kubernetes 인증 파일 확인
  ansible.builtin.stat:
    path: "{{ argocd_kubeconfig }}"
  register: argocd_kubeconfig_file

- name: Kubernetes 클러스터가 구성되어 있어야 함
  ansible.builtin.assert:
    that: argocd_kubeconfig_file.stat.exists
    fail_msg: "{{ argocd_kubeconfig }}가 없습니다. Kubernetes 클러스터를 먼저 구성하세요."

- name: Helm 실행 의존성 설치
  ansible.builtin.apt:
    name: [ca-certificates, python3-yaml, tar]
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: 현재 Helm 버전 조회
  ansible.builtin.command:
    argv: ["{{ argocd_helm_binary }}", version, --short]
  register: argocd_current_helm
  changed_when: false
  failed_when: false
  check_mode: false

- name: 고정 버전 Helm 설치
  when: >-
    argocd_current_helm.rc != 0 or
    argocd_current_helm.stdout.split('+')[0] != argocd_helm_version
  block:
    - name: Helm 설치 임시 디렉터리 생성
      ansible.builtin.tempfile:
        state: directory
        prefix: orbit-helm-
      register: argocd_helm_tmp

    - name: Helm 배포 파일 다운로드 및 SHA256 검증
      ansible.builtin.get_url:
        url: "https://get.helm.sh/helm-{{ argocd_helm_version }}-linux-{{ argocd_helm_architectures[ansible_facts['architecture']] }}.tar.gz"
        dest: "{{ argocd_helm_tmp.path }}/helm.tar.gz"
        checksum: "sha256:https://get.helm.sh/helm-{{ argocd_helm_version }}-linux-{{ argocd_helm_architectures[ansible_facts['architecture']] }}.tar.gz.sha256sum"
        mode: "0644"

    - name: Helm 배포 파일 압축 해제
      ansible.builtin.unarchive:
        src: "{{ argocd_helm_tmp.path }}/helm.tar.gz"
        dest: "{{ argocd_helm_tmp.path }}"
        remote_src: true

    - name: Helm 실행 파일 설치
      ansible.builtin.copy:
        src: "{{ argocd_helm_tmp.path }}/linux-{{ argocd_helm_architectures[ansible_facts['architecture']] }}/helm"
        dest: "{{ argocd_helm_binary }}"
        remote_src: true
        owner: root
        group: root
        mode: "0755"
  always:
    - name: Helm 설치 임시 파일 정리
      ansible.builtin.file:
        path: "{{ argocd_helm_tmp.path }}"
        state: absent
      when: argocd_helm_tmp.path is defined

- name: Kubernetes API 준비 확인
  ansible.builtin.command: kubectl get --raw=/readyz --request-timeout=10s
  changed_when: false

- name: Argo CD Helm 저장소 등록
  kubernetes.core.helm_repository:
    binary_path: "{{ argocd_helm_binary }}"
    name: "{{ argocd_chart_repo_name }}"
    repo_url: "{{ argocd_chart_repo_url }}"
    repo_state: present

# chart_repo_url 대신 등록한 저장소의 chart_ref를 사용하여
# 모듈이 기존 release의 chart 버전과 values를 비교하도록 한다.
- name: Argo CD 설치 또는 업그레이드
  kubernetes.core.helm:
    binary_path: "{{ argocd_helm_binary }}"
    kubeconfig: "{{ argocd_kubeconfig }}"
    release_name: "{{ argocd_release_name }}"
    release_namespace: "{{ argocd_namespace }}"
    create_namespace: true
    chart_ref: "{{ argocd_chart_ref }}"
    chart_version: "{{ argocd_chart_version }}"
    release_values: "{{ argocd_values }}"
    release_state: present
    reset_values: true
    update_repo_cache: true
    wait: true
    timeout: "{{ argocd_wait_timeout }}"

- name: Argo CD 주요 워크로드 조회
  ansible.builtin.command:
    argv:
      - kubectl
      - -n
      - "{{ argocd_namespace }}"
      - get
      - deployment,statefulset
      - -l
      - "app.kubernetes.io/instance={{ argocd_release_name }}"
      - -o
      - name
      - --request-timeout=10s
  register: argocd_workloads
  changed_when: false

- name: Argo CD 워크로드가 존재해야 함
  ansible.builtin.assert:
    that: argocd_workloads.stdout_lines | length > 0
    fail_msg: Argo CD Deployment·StatefulSet을 찾을 수 없습니다.

- name: Argo CD 주요 워크로드 배포 완료 대기
  ansible.builtin.command:
    argv:
      - kubectl
      - -n
      - "{{ argocd_namespace }}"
      - rollout
      - status
      - "{{ item }}"
      - "--timeout={{ argocd_wait_timeout }}"
  loop: "{{ argocd_workloads.stdout_lines }}"
  changed_when: false

# 설치 hook의 완료된 Job Pod는 Ready 조건이 없으므로 제외한다.
- name: Argo CD 주요 Pod Ready 대기
  ansible.builtin.command:
    argv:
      - kubectl
      - -n
      - "{{ argocd_namespace }}"
      - wait
      - --for=condition=Ready
      - pod
      - -l
      - "app.kubernetes.io/instance={{ argocd_release_name }}"
      - --field-selector=status.phase!=Succeeded
      - "--timeout={{ argocd_wait_timeout }}"
  changed_when: false
