# polaris에서 실행: Argo CD HelmChart를 k3s 자동 설치 폴더에 놓고 설치가 끝날 때까지 기다림
- name: k3s가 설치되어 있어야 함 (playbooks/cluster.yml 먼저)
  ansible.builtin.stat:
    path: "{{ argocd_manifest | dirname }}"
  register: argocd_manifest_dir

- name: k3s 자동 설치 폴더가 없으면 멈춤
  ansible.builtin.assert:
    that: argocd_manifest_dir.stat.isdir | default(false)
    fail_msg: "{{ argocd_manifest | dirname }} 없음. 먼저 ansible-playbook playbooks/cluster.yml"

# 읽기 전용이므로 --check에서도 실제 taint를 확인함. 이상이 있으면 manifest를 쓰기 전에 멈춤.
- name: control plane 노드의 taint 읽기
  ansible.builtin.command:
    argv:
      - /usr/local/bin/k3s
      - kubectl
      - get
      - node
      - "{{ inventory_hostname }}"
      - -o
      - json
  register: argocd_cp_node
  changed_when: false
  check_mode: false

- name: control plane에 NoSchedule taint가 있어야 함
  ansible.builtin.assert:
    that:
      - >-
        (argocd_cp_taints | selectattr('key', 'equalto', 'node-role.kubernetes.io/control-plane')
          | selectattr('value', 'defined') | selectattr('value', 'equalto', 'true')
          | selectattr('effect', 'equalto', 'NoSchedule') | list | length) > 0
    fail_msg: >-
      {{ inventory_hostname }}에 node-role.kubernetes.io/control-plane=true:NoSchedule taint가 없음.
      Argo CD 설치 전에 k3s 노드 설정을 확인하세요. 현재 taint: {{ argocd_cp_taints | to_json }}
    quiet: true
  vars:
    argocd_cp_taints: "{{ (argocd_cp_node.stdout | from_json).spec.taints | default([]) }}"

- name: Argo CD HelmChart
  ansible.builtin.template:
    src: argocd-helmchart.yaml.j2
    dest: "{{ argocd_manifest }}"
    mode: "0600"

- name: 설치 대기
  when: not ansible_check_mode   # 미리보기에서는 파일을 놓지 않아 설치되지 않음
  block:
    # Job 이름은 업그레이드에도 재사용됨. 이전 Job 성공 대신 최신 Helm release를 확인함.
    # controller가 파일을 늦게 반영하거나 업그레이드가 진행 중·실패했으면 계속 기다림.
    # argocd용 HelmChartConfig를 만들면 그 values가 release에 합쳐져 비교가 맞지 않음. 쓰려면 이 확인도 함께 고칠 것.
    - name: 원하는 버전과 설정의 Helm release가 배포될 때까지 대기
      vars:
        argocd_expected_chart: "{{ lookup('ansible.builtin.template', 'argocd-helmchart.yaml.j2') | from_yaml }}"
      ansible.builtin.command:
        argv:
          - python3
          - -c
          - "{{ lookup('ansible.builtin.file', role_path ~ '/files/check-release.py') }}"
        stdin: >-
          {{ argocd_expected_chart | combine({'expectedValues':
             argocd_expected_chart.spec.valuesContent | from_yaml}) | to_json }}
      register: argocd_release
      changed_when: false
      retries: "{{ argocd_ready_retries }}"
      delay: 10
      until: argocd_release.rc == 0

    - name: Argo CD 구성요소 rollout
      ansible.builtin.command: >-
        /usr/local/bin/k3s kubectl -n {{ argocd_namespace }} rollout status {{ item }} --timeout=300s
      loop:
        - statefulset/argocd-application-controller
        - deployment/argocd-repo-server
        - deployment/argocd-server
        - deployment/argocd-redis
        - deployment/argocd-applicationset-controller
      changed_when: false

    - name: Argo CD 파드의 배치 노드 읽기
      ansible.builtin.command: >-
        /usr/local/bin/k3s kubectl -n {{ argocd_namespace }} get pods
        -l app.kubernetes.io/instance=argocd -o json
      register: argocd_pods
      changed_when: false

    - name: Argo CD 파드가 있어야 함
      ansible.builtin.assert:
        that: argocd_current_pods | length > 0
        fail_msg: "{{ argocd_namespace }}에 배치 확인할 Argo CD 파드가 없음"
        quiet: true
      vars:
        argocd_current_pods: >-
          {{ (argocd_pods.stdout | from_json)['items']
             | rejectattr('metadata.deletionTimestamp', 'defined') | list }}

    - name: Argo CD 파드는 모두 워커에 배치되어야 함
      ansible.builtin.assert:
        that: (item.spec.nodeName | default('')) in groups['workers']
        fail_msg: >-
          {{ item.metadata.name }}의 배치 노드가 {{ item.spec.nodeName | default('(미배치)') }}임.
          허용된 워커: {{ groups['workers'] | join(', ') }}
        quiet: true
      loop: >-
        {{ (argocd_pods.stdout | from_json)['items']
           | rejectattr('metadata.deletionTimestamp', 'defined') | list }}
      loop_control:
        label: "{{ item.metadata.name }}"

- name: 애드온 namespace와 AppProject
  ansible.builtin.include_tasks: projects.yml
