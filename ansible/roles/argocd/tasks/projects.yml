# 애드온 namespace와 AppProject (default 잠금, root 전용, 애드온). root Application보다 먼저 적용
- name: AppProject 파일 폴더 (root만)
  ansible.builtin.file:
    path: "{{ argocd_projects_file | dirname }}"
    state: directory
    mode: "0700"

- name: namespace·AppProject 정의
  ansible.builtin.template:
    src: argocd-projects.yaml.j2
    dest: "{{ argocd_projects_file }}"
    mode: "0600"

- name: namespace·AppProject 적용
  ansible.builtin.command:
    argv: [/usr/local/bin/k3s, kubectl, apply, -f, "{{ argocd_projects_file }}"]
  register: argocd_projects_apply
  changed_when: argocd_projects_apply.stdout_lines | reject('search', ' unchanged$') | list | length > 0
  when: not ansible_check_mode   # 미리보기에서는 파일을 놓지 않음

- name: AppProject 읽기
  ansible.builtin.command:
    argv: [/usr/local/bin/k3s, kubectl, -n, "{{ argocd_namespace }}", get, appproject, -o, json]
  register: argocd_projects
  changed_when: false
  when: not ansible_check_mode

- name: default는 잠겨 있고 root·애드온 프로젝트가 있어야 함
  ansible.builtin.assert:
    that:
      - argocd_project_root in argocd_project_specs
      - argocd_project_addons in argocd_project_specs
      - argocd_project_specs['default'].sourceRepos | default([]) | length == 0
      - argocd_project_specs['default'].destinations | default([]) | length == 0
    fail_msg: "AppProject가 원하는 상태가 아님: {{ argocd_project_specs.keys() | list }}"
    quiet: true
  vars:
    argocd_project_items: "{{ (argocd_projects.stdout | from_json)['items'] }}"
    argocd_project_specs: >-
      {{ dict(argocd_project_items | map(attribute='metadata.name')
              | zip(argocd_project_items | map(attribute='spec'))) }}
  when: not ansible_check_mode
