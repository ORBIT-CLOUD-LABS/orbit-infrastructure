---
# --- kubeadm init ---
# admin.conf는 init 도중(kubeconfig 단계)에 생기므로 그것만으로는 완료 여부를 알 수 없다.
# 그래서 init 직전에 "시작" 표식, 끝까지 성공하면 "완료" 표식을 남기고 아래 기준으로 판단한다.
#   done    : admin.conf 있음 + (완료 표식 있음 또는 kube-proxy 조회됨) → init 건너뜀
#   no_admin_conf : 완료 표식은 있는데 admin.conf만 없음 → 클러스터는 멀쩡할 수 있어 멈추고 복구 안내
#   partial : 시작 표식만 있고 완료 표식은 없음 → 이 플레이북이 init하다 실패한 것이 확실 → reset 후 다시 init
#   unknown : 표식 없이 init 흔적만 있고 done이 아님 → 직접 만든 클러스터일 수 있어 멈추고 확인 요청
#   fresh   : 흔적 없음 → init
# kubeadm reset -f는 etcd 데이터까지 지우므로, 자동 reset은 partial(설치 미완료가 확실한 경우)에만 한다.
# 완료 표식이 있으면 한 번은 init에 성공한 노드이므로 어떤 경우에도 자동 reset하지 않는다.
- name: init 흔적 확인
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - /etc/kubernetes/admin.conf
    - /etc/kubernetes/manifests/kube-apiserver.yaml
    - "{{ k8s_init_started_marker }}"
    - "{{ k8s_init_done_marker }}"
  register: init_files

- name: init 흔적 정리
  ansible.builtin.set_fact:
    has_admin_conf: "{{ init_files.results[0].stat.exists }}"
    has_apiserver_manifest: "{{ init_files.results[1].stat.exists }}"
    has_started_marker: "{{ init_files.results[2].stat.exists }}"
    has_done_marker: "{{ init_files.results[3].stat.exists }}"

# 완료 표식이 없어도 이미 끝까지 init된 클러스터일 수 있다 (표식 도입 전에 만들었거나 표식 쓰기만 실패한 경우).
# kube-proxy는 init 마지막 단계(addon)에서 만들어지므로, 조회되면 init이 끝난 것으로 본다.
# 재부팅 직후엔 API 서버가 늦게 뜰 수 있어 재시도한다.
# kubectl은 기본 요청 시간 제한이 없어 응답 없는 API 서버에서 멈추면 재시도로 넘어가지 못하므로
# 재시도하는 조회에는 --request-timeout을 붙인다.
- name: 완료 표식 없는 클러스터가 init을 마쳤는지 확인
  ansible.builtin.command: kubectl get daemonset kube-proxy -n kube-system --request-timeout=10s
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  register: kube_proxy
  until: kube_proxy.rc == 0
  retries: 12
  delay: 10
  failed_when: false
  changed_when: false
  when: has_admin_conf and not has_done_marker

- name: init 상태 판단
  ansible.builtin.set_fact:
    k8s_init_state: >-
      {{ 'done' if has_admin_conf and (has_done_marker or kube_proxy.rc | default(1) == 0)
         else 'no_admin_conf' if has_done_marker
         else 'partial' if has_started_marker
         else 'unknown' if has_admin_conf or has_apiserver_manifest
         else 'fresh' }}

- name: 완료된 클러스터에서 admin.conf만 없으면 reset하지 않고 중단
  ansible.builtin.fail:
    msg: >-
      {{ inventory_hostname }}: init이 완료된 노드인데 /etc/kubernetes/admin.conf가 없습니다.
      클러스터는 정상일 수 있으니 'sudo kubeadm init phase kubeconfig admin'으로 admin.conf를 다시 만든 뒤
      다시 실행하세요. 일부러 'kubeadm reset'한 노드라면 {{ k8s_init_started_marker }},
      {{ k8s_init_done_marker }} 두 파일을 지우고 다시 실행하면 새로 init합니다.
  when: k8s_init_state == 'no_admin_conf'

- name: 상태를 알 수 없으면 reset하지 않고 중단
  ansible.builtin.fail:
    msg: >-
      {{ inventory_hostname }}: kubeadm init 흔적(admin.conf 또는 kube-apiserver 매니페스트)은 있지만
      이 플레이북이 시작한 init이 아니고, 완료된 클러스터인지도 확인하지 못했습니다
      (kube-proxy 조회 결과: {{ kube_proxy.stderr | default('조회 안 함') }}).
      API 서버 장애나 인증서 만료일 수 있으니 직접 확인하세요. 클러스터를 버려도 된다면
      'sudo kubeadm reset -f' 후 다시 실행하면 됩니다. (reset은 etcd 데이터를 지웁니다)
  when: k8s_init_state == 'unknown'

- name: 중간에 실패한 init 정리
  ansible.builtin.command: kubeadm reset -f
  when: k8s_init_state == 'partial'

- name: init 시작 표식 남기기
  ansible.builtin.copy:
    dest: "{{ k8s_init_started_marker }}"
    content: "kubeadm init started by ansible\n"
    mode: "0644"
  when: k8s_init_state != 'done'

- name: kubeadm init
  ansible.builtin.command: >
    kubeadm init
    --apiserver-advertise-address={{ ansible_host }}
    --pod-network-cidr={{ pod_network_cidr }}
    --node-name={{ inventory_hostname }}
  when: k8s_init_state != 'done'

- name: init 완료 표식 남기기
  ansible.builtin.copy:
    dest: "{{ k8s_init_done_marker }}"
    content: "kubeadm init completed\n"
    mode: "0644"

- name: API 서버 응답 대기
  ansible.builtin.command: kubectl get --raw=/readyz --request-timeout=10s
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  register: apiserver_ready
  until: apiserver_ready.rc == 0
  retries: 30
  delay: 10
  changed_when: false

- name: 접속 사용자 kubeconfig 디렉터리
  ansible.builtin.file:
    path: "/home/{{ ansible_user }}/.kube"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0700"

- name: 접속 사용자 kubeconfig 복사
  ansible.builtin.copy:
    src: /etc/kubernetes/admin.conf
    dest: "/home/{{ ansible_user }}/.kube/config"
    remote_src: true
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0600"

# --- Calico (Tigera Operator) ---
# 일부만 설치된 상태도 복구되도록 "설치됐는지"로 건너뛰지 않고 매번 선언한 상태로 맞춘다.
# apply는 매번 changed로 나오므로 diff로 바뀔 내용이 있을 때만 apply한다.
# kubectl diff는 0 = 차이 없음, 1 = 차이 있음, 그 외 = 오류다. 첫 설치 때는 namespace가 아직 없어서
# diff가 오류를 내므로 0이 아니면 모두 apply하고, 진짜 오류는 apply에서 드러나게 한다.
# CRD가 커서 일반 apply는 annotation 크기 제한에 걸리므로 Operator 매니페스트는 --server-side로 적용한다.
- name: Calico Operator 매니페스트 변경 확인
  ansible.builtin.command: kubectl diff --server-side -f {{ item }}
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  loop:
    - https://raw.githubusercontent.com/projectcalico/calico/{{ calico_version }}/manifests/operator-crds.yaml
    - https://raw.githubusercontent.com/projectcalico/calico/{{ calico_version }}/manifests/tigera-operator.yaml
  register: calico_operator_diff
  failed_when: false
  changed_when: false

- name: Calico Operator CRD·Tigera Operator 적용
  ansible.builtin.command: kubectl apply --server-side -f {{ item.item }}
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  loop: "{{ calico_operator_diff.results }}"
  loop_control:
    label: "{{ item.item | basename }}"
  when: item.rc != 0

- name: Installation CRD 등록 대기
  ansible.builtin.command: kubectl wait --for=condition=established crd/installations.operator.tigera.io crd/apiservers.operator.tigera.io --timeout=120s
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  changed_when: false

- name: Calico Installation 매니페스트 작성 (Pod CIDR 지정)
  ansible.builtin.copy:
    dest: /tmp/calico-installation.yaml
    content: |
      apiVersion: operator.tigera.io/v1
      kind: Installation
      metadata:
        name: default
      spec:
        calicoNetwork:
          ipPools:
            - name: default-ipv4-ippool
              blockSize: 26
              cidr: {{ pod_network_cidr }}
              encapsulation: VXLANCrossSubnet
              natOutgoing: Enabled
              nodeSelector: all()
      ---
      apiVersion: operator.tigera.io/v1
      kind: APIServer
      metadata:
        name: default
      spec: {}

# Installation은 Operator가 기본값을 채워 넣는 리소스라, server-side apply를 쓰면 그 필드와 소유권 충돌이
# 날 수 있다. 일반(client-side) apply는 우리가 적은 필드만 비교하므로 이쪽은 일반 apply를 쓴다.
- name: Calico Installation·APIServer 변경 확인
  ansible.builtin.command: kubectl diff -f /tmp/calico-installation.yaml
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  register: calico_installation_diff
  failed_when: false
  changed_when: false

- name: Calico Installation·APIServer 적용
  ansible.builtin.command: kubectl apply -f /tmp/calico-installation.yaml
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  when: calico_installation_diff.rc != 0

- name: Calico 준비 완료 대기
  ansible.builtin.command: kubectl wait --for=condition=Available tigerastatus/calico --timeout=30s
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  register: calico_ready
  until: calico_ready.rc == 0
  retries: 20
  delay: 15
  changed_when: false

# --- worker join ---
- name: join 명령 생성
  ansible.builtin.command: kubeadm token create --print-join-command
  register: join_cmd
  changed_when: false

- name: join 명령을 worker가 쓸 수 있게 저장
  ansible.builtin.set_fact:
    join_command: "{{ join_cmd.stdout }}"
