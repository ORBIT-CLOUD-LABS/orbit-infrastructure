---
- name: 이미 init 됐는지 확인
  ansible.builtin.stat:
    path: /etc/kubernetes/admin.conf
  register: admin_conf

- name: kubeadm init
  ansible.builtin.command: >
    kubeadm init
    --apiserver-advertise-address={{ ansible_host }}
    --pod-network-cidr={{ pod_network_cidr }}
    --node-name={{ inventory_hostname }}
  when: not admin_conf.stat.exists

- name: 접속 사용자 kubeconfig 디렉터리
  ansible.builtin.file:
    path: "/home/{{ ansible_user }}/.kube"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0700"

- name: 접속 사용자 kubeconfig 복사
  ansible.builtin.copy:
    src: /etc/kubernetes/admin.conf
    dest: "/home/{{ ansible_user }}/.kube/config"
    remote_src: true
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0600"

- name: Calico 설치 여부 확인
  command: kubectl get installation default
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  register: calico_installed
  failed_when: false
  changed_when: false

- name: Calico Operator CRD 설치
  command: >
    kubectl create -f
    https://raw.githubusercontent.com/projectcalico/calico/{{ calico_version }}/manifests/operator-crds.yaml
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  when: calico_installed.rc != 0

- name: Tigera Operator 설치
  command: >
    kubectl create -f
    https://raw.githubusercontent.com/projectcalico/calico/{{ calico_version }}/manifests/tigera-operator.yaml
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  when: calico_installed.rc != 0

- name: Installation CRD 등록 대기
  command: kubectl wait --for=condition=established crd/installations.operator.tigera.io --timeout=120s
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  changed_when: false

- name: Calico Installation 매니페스트 작성 (Pod CIDR 지정)
  copy:
    dest: /tmp/calico-installation.yaml
    content: |
      apiVersion: operator.tigera.io/v1
      kind: Installation
      metadata:
        name: default
      spec:
        calicoNetwork:
          ipPools:
            - name: default-ipv4-ippool
              blockSize: 26
              cidr: {{ pod_network_cidr }}
              encapsulation: VXLANCrossSubnet
              natOutgoing: Enabled
              nodeSelector: all()
      ---
      apiVersion: operator.tigera.io/v1
      kind: APIServer
      metadata:
        name: default
      spec: {}

- name: Calico Installation 적용
  command: kubectl apply -f /tmp/calico-installation.yaml
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  when: calico_installed.rc != 0

- name: Calico 준비 완료 대기
  command: kubectl wait --for=condition=Available tigerastatus/calico --timeout=30s
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  register: calico_ready
  until: calico_ready.rc == 0
  retries: 20
  delay: 15
  changed_when: false
- name: join 명령 생성
  ansible.builtin.command: kubeadm token create --print-join-command
  register: join_cmd
  changed_when: false

- name: join 명령을 worker가 쓸 수 있게 저장
  ansible.builtin.set_fact:
    join_command: "{{ join_cmd.stdout }}"