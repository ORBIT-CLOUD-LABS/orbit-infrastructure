---
- name: 이미 init 됐는지 확인
  ansible.builtin.stat:
    path: /etc/kubernetes/admin.conf
  register: admin_conf

- name: kubeadm init
  ansible.builtin.command: >
    kubeadm init
    --apiserver-advertise-address={{ ansible_host }}
    --pod-network-cidr={{ pod_cidr }}
    --node-name={{ inventory_hostname }}
  when: not admin_conf.stat.exists

- name: ubuntu 사용자 kubeconfig 디렉터리
  ansible.builtin.file:
    path: /home/ubuntu/.kube
    state: directory
    owner: ubuntu
    group: ubuntu
    mode: "0700"

- name: ubuntu 사용자 kubeconfig 복사
  ansible.builtin.copy:
    src: /etc/kubernetes/admin.conf
    dest: /home/ubuntu/.kube/config
    remote_src: true
    owner: ubuntu
    group: ubuntu
    mode: "0600"

- name: CNI(Flannel) 설치
  ansible.builtin.command: kubectl apply -f {{ flannel_manifest }}
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  register: flannel_out
  changed_when: "'created' in flannel_out.stdout or 'configured' in flannel_out.stdout"

- name: join 명령 생성
  ansible.builtin.command: kubeadm token create --print-join-command
  register: join_cmd
  changed_when: false

- name: join 명령을 worker가 쓸 수 있게 저장
  ansible.builtin.set_fact:
    join_command: "{{ join_cmd.stdout }}"
