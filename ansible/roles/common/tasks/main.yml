---
# --- swap 끄기 (kubelet 요구사항) ---
- name: swap off
  ansible.builtin.command: swapoff -a
  when: ansible_swaptotal_mb > 0

- name: fstab에서 swap 주석 처리
  ansible.builtin.replace:
    path: /etc/fstab
    regexp: '^([^#].*\sswap\s.*)$'
    replace: '# \1'

# --- 커널 모듈 + sysctl ---
- name: 커널 모듈 부팅 시 로드
  ansible.builtin.copy:
    dest: /etc/modules-load.d/k8s.conf
    content: |
      overlay
      br_netfilter
    mode: "0644"

- name: 커널 모듈 지금 로드
  ansible.builtin.command: modprobe {{ item }}
  loop: [overlay, br_netfilter]
  changed_when: false

- name: sysctl 설정
  ansible.builtin.copy:
    dest: /etc/sysctl.d/k8s.conf
    content: |
      net.bridge.bridge-nf-call-iptables  = 1
      net.bridge.bridge-nf-call-ip6tables = 1
      net.ipv4.ip_forward                 = 1
    mode: "0644"
  notify: reload sysctl

- name: sysctl 즉시 반영
  ansible.builtin.meta: flush_handlers

# --- containerd ---
- name: 기본 패키지 설치
  ansible.builtin.apt:
    name: [containerd, apt-transport-https, ca-certificates, curl, gpg]
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: containerd 설정 디렉터리
  ansible.builtin.file:
    path: /etc/containerd
    state: directory
    mode: "0755"

- name: containerd 기본 설정 생성
  ansible.builtin.shell: containerd config default > /etc/containerd/config.toml
  args:
    creates: /etc/containerd/config.toml

- name: SystemdCgroup = true (kubelet과 cgroup 드라이버 일치)
  ansible.builtin.replace:
    path: /etc/containerd/config.toml
    regexp: 'SystemdCgroup = false'
    replace: 'SystemdCgroup = true'
  notify: restart containerd

- name: containerd 실행
  ansible.builtin.systemd:
    name: containerd
    state: started
    enabled: true

# --- kubeadm / kubelet / kubectl ---
- name: keyrings 디렉터리
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Kubernetes apt 키 다운로드
  ansible.builtin.get_url:
    url: "https://pkgs.k8s.io/core:/stable:/{{ k8s_version }}/deb/Release.key"
    dest: /tmp/k8s-release.key
    mode: "0644"

- name: Kubernetes apt 키 등록
  ansible.builtin.command: gpg --dearmor -o /etc/apt/keyrings/kubernetes-apt-keyring.gpg /tmp/k8s-release.key
  args:
    creates: /etc/apt/keyrings/kubernetes-apt-keyring.gpg

- name: Kubernetes apt 저장소
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/{{ k8s_version }}/deb/ /"
    filename: kubernetes
    state: present

- name: kubelet kubeadm kubectl 설치
  ansible.builtin.apt:
    name: [kubelet, kubeadm, kubectl]
    state: present
    update_cache: true

- name: 버전 고정 (apt upgrade로 안 올라가게)
  ansible.builtin.dpkg_selections:
    name: "{{ item }}"
    selection: hold
  loop: [kubelet, kubeadm, kubectl]

- name: kubelet 활성화
  ansible.builtin.systemd:
    name: kubelet
    enabled: true
