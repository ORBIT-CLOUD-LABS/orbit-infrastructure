---
# 저장 경로 (Terraform이 데이터 volume을 붙였으면 장치 이름 지정, 비우면 루트 디스크)
monitoring_data_device: ""
monitoring_data_dir: /srv/monitoring       # 시계열·로그 데이터
monitoring_config_dir: /opt/orbit-monitoring  # compose·설정 파일

# 이미지 버전 (고정해야 재구축 결과가 같다)
prometheus_image: prom/prometheus:v2.53.0
alertmanager_image: prom/alertmanager:v0.27.0
grafana_image: grafana/grafana:11.3.0
loki_image: grafana/loki:3.3.2

# Retention
prometheus_retention_time: 15d
prometheus_retention_size: 20GB
loki_retention_period: 336h               # 14일

# 수집
prometheus_scrape_interval: 15s
monitoring_node_exporter_groups:          # node-exporter(:9100) 수집 대상 그룹
  - control_plane
  - workers
  - jenkins
  - nfs
  - vehicle_db
  - monitoring
  - sol
  - terra
  - luna

# 비밀값 (vault)
grafana_admin_password: ""
alertmanager_slack_webhook: ""
alertmanager_slack_channel: "#orbit-alerts"
