# 클러스터 입구·API VIP(k3s_vip). server 3대가 VRRP로 나눠 갖고, 자기 API 서버가 응답하지 않으면 내려놓음
# 다른 쌍(fw, rp)과 VRRP ID가 겹쳐도 섞이지 않게 멀티캐스트 대신 같은 클러스터 server에게만 보냄(unicast)
- name: keepalived 설치
  ansible.builtin.apt:
    name: keepalived
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: API 서버 확인 스크립트
  ansible.builtin.copy:
    dest: /etc/keepalived/k3s-api-check.sh
    mode: "0755"
    owner: root
    group: root
    content: |
      #!/bin/sh
      # {{ ansible_managed }}
      # 이 노드의 API 서버가 준비됐는지 (keepalived가 root로 실행). 실패하면 VIP를 다른 server로 넘김
      exec /usr/local/bin/k3s kubectl --request-timeout=3s get --raw /readyz >/dev/null 2>&1
  notify: restart keepalived

- name: keepalived 설정
  ansible.builtin.template:
    src: keepalived.conf.j2
    dest: /etc/keepalived/keepalived.conf
    mode: "0644"
  notify: restart keepalived

- name: keepalived 켜기
  ansible.builtin.systemd_service:
    name: keepalived
    enabled: true
    state: started
  when: not ansible_check_mode

- name: 설정이 바뀌었으면 지금 재시작
  ansible.builtin.meta: flush_handlers
