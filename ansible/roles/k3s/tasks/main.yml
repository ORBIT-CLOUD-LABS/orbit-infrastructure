# k3s 서버 설치. 클러스터마다 server 3대, 내장 etcd. -1이 cluster-init, -2·-3은 -1에 붙음
# playbooks/cluster.yml이 secrets.yml(토큰, Cilium CA) → -1 → -2 → -3 순서로 실행함
- name: 사전 확인
  ansible.builtin.include_tasks: preflight.yml

- name: 첫 server(-1)인지
  ansible.builtin.set_fact:
    k3s_init: "{{ inventory_hostname == k3s_cluster_hosts[0] }}"

- name: 토큰과 Cilium CA가 있어야 함 (secrets.yml 먼저)
  ansible.builtin.assert:
    that:
      - hostvars[k3s_cluster_hosts[0]].k3s_token is defined
      - hostvars[groups['k3s'][0]].k3s_cilium_ca is defined
    fail_msg: "join 토큰이나 Cilium CA를 Vault에서 읽지 않았음. playbooks/cluster.yml은 비밀값 단계부터 순서대로 실행함"
    quiet: true

- name: 설정 폴더
  ansible.builtin.file:
    path: /etc/rancher/k3s
    state: directory
    mode: "0755"

- name: k3s 설정 (/etc/rancher/k3s/config.yaml)
  ansible.builtin.template:
    src: config-server.yaml.j2
    dest: /etc/rancher/k3s/config.yaml
    mode: "0600"
  diff: false   # join 토큰이 들어 있어서 diff를 숨김
  notify: restart k3s

- name: k3s 자동 설치 정의 (k3s가 시작하면 helm-controller가 설치)
  block:
    - name: k3s 자동 설치 폴더
      ansible.builtin.file:
        path: /var/lib/rancher/k3s/server/manifests
        state: directory
        mode: "0700"

    - name: Cilium HelmChart (Cluster Mesh, Hubble)
      ansible.builtin.template:
        src: cilium-helmchart.yaml.j2
        dest: /var/lib/rancher/k3s/server/manifests/orbit-cilium.yaml
        mode: "0600"
      diff: false   # Cilium CA 키가 들어 있어서 diff를 숨김

    - name: Traefik 설정 (NodePort로 클러스터 입구)
      ansible.builtin.template:
        src: traefik-config.yaml.j2
        dest: /var/lib/rancher/k3s/server/manifests/orbit-traefik-config.yaml
        mode: "0600"

- name: 지금 설치된 k3s 버전
  ansible.builtin.command: /usr/local/bin/k3s --version
  register: k3s_installed
  changed_when: false
  failed_when: false
  check_mode: false

- name: 설치 또는 버전 변경
  when: k3s_version not in (k3s_installed.stdout | default(''))
  block:
    - name: 설치 스크립트 받기
      ansible.builtin.get_url:
        url: "{{ k3s_install_url }}"
        dest: "{{ k3s_install_script }}"
        mode: "0755"
        force: true

    # 토큰과 붙을 서버 주소는 config.yaml에 있음
    - name: k3s 설치 server {{ k3s_version }}
      ansible.builtin.command: "{{ k3s_install_script }}"
      environment:
        INSTALL_K3S_VERSION: "{{ k3s_version }}"
        INSTALL_K3S_EXEC: server
      changed_when: true
      when: not ansible_check_mode

- name: k3s 서비스 켜기
  ansible.builtin.systemd_service:
    name: k3s
    enabled: true
    state: started
  when: not ansible_check_mode

- name: 설정이 바뀌었으면 지금 재시작
  ansible.builtin.meta: flush_handlers

- name: 클러스터 입구·API VIP (keepalived)
  ansible.builtin.include_tasks: keepalived.yml

- name: kubeconfig를 astra로 (-1에서만, 서버 주소는 VIP)
  when: k3s_init and not ansible_check_mode
  block:
    - name: kubeconfig 읽기
      ansible.builtin.slurp:
        src: /etc/rancher/k3s/k3s.yaml
      register: k3s_kubeconfig_file
      no_log: true

    - name: kubeconfig 폴더 (astra)
      ansible.builtin.file:
        path: "{{ k3s_kubeconfig_local | dirname }}"
        state: directory
        mode: "0700"
      delegate_to: localhost
      become: false

    # 이름 default를 클러스터 이름으로 바꿔 여러 파일을 KUBECONFIG에 함께 넣어도 겹치지 않게 함
    - name: kubeconfig 저장 ({{ k3s_kubeconfig_local }})
      ansible.builtin.copy:
        content: >-
          {{ k3s_kubeconfig_file.content | b64decode
             | replace('https://127.0.0.1:6443', k3s_api_url)
             | regex_replace('(?m)^(\s*(?:- )?(?:name|cluster|user|current-context)): default$', '\1: ' ~ k3s_cluster_name) }}
        dest: "{{ k3s_kubeconfig_local }}"
        mode: "0600"
      delegate_to: localhost
      become: false
      no_log: true
