# polaris에서 실행: 데이터 저장소 SQLite, 노드 4대 Ready, control plane 라벨·taint, Cilium 정상
- name: SQLite 데이터 파일
  ansible.builtin.stat:
    path: /var/lib/rancher/k3s/server/db/state.db
  register: k3s_sqlite_db

- name: 내장 etcd 데이터 폴더
  ansible.builtin.stat:
    path: /var/lib/rancher/k3s/server/db/etcd
  register: k3s_etcd_dir

- name: 데이터 저장소가 SQLite인지 (etcd 미사용)
  ansible.builtin.assert:
    that:
      - k3s_sqlite_db.stat.exists
      - not k3s_etcd_dir.stat.exists
    fail_msg: "state.db가 없거나 db/etcd가 있음. k3s가 SQLite가 아닌 etcd로 떠 있을 수 있음 (docs/k3s.md)"

- name: 노드가 전부 Ready가 될 때까지 대기
  ansible.builtin.command: /usr/local/bin/k3s kubectl get nodes --no-headers
  register: k3s_nodes
  changed_when: false
  retries: "{{ k3s_nodes_ready_retries }}"
  delay: 10
  until: >-
    k3s_nodes.rc == 0 and
    (k3s_nodes.stdout_lines | length) == (groups['k3s'] | length) and
    (k3s_nodes.stdout_lines | select('search', ' Ready ') | list | length) == (groups['k3s'] | length)

- name: 노드 라벨과 taint 읽기
  ansible.builtin.command: /usr/local/bin/k3s kubectl get nodes -o json
  register: k3s_node_meta
  changed_when: false

# cp: 라벨 키가 있고 값이 true, k3s_cp_taint와 똑같은 taint가 있음
# 워커: 라벨 키 자체가 없고, 같은 키의 taint도 (값·effect와 상관없이) 없음
- name: control plane 라벨과 taint는 polaris에만
  ansible.builtin.assert:
    that:
      - k3s_node | length > 0
      - >-
        (k3s_cp_label in k3s_node_labels and k3s_node_labels[k3s_cp_label] == 'true')
        if item in groups['cp'] else (k3s_cp_label not in k3s_node_labels)
      - >-
        (k3s_node_taints | selectattr('key', 'equalto', k3s_cp_taint_key)
          | selectattr('value', 'defined') | selectattr('value', 'equalto', k3s_cp_taint_value)
          | selectattr('effect', 'equalto', k3s_cp_taint_effect) | list | length > 0)
        if item in groups['cp'] else
        (k3s_node_taints | selectattr('key', 'equalto', k3s_cp_taint_key) | list | length == 0)
    fail_msg: >-
      {{ item }}: control-plane 라벨·taint({{ k3s_cp_taint }})가
      {{ 'cp에는 있어야 함' if item in groups['cp'] else '워커에는 없어야 함 (키 자체가 없어야 함)' }}.
      현재: {{ ('라벨=' ~ (k3s_node_labels[k3s_cp_label] | default('(없음)')) ~ ', taint=' ~ (k3s_node_taints | to_json))
               if k3s_node | length > 0 else '노드 없음' }}
    quiet: true
  loop: "{{ groups['k3s'] }}"
  vars:
    k3s_cp_label: node-role.kubernetes.io/control-plane
    k3s_cp_taint_key: "{{ k3s_cp_taint.split('=')[0] }}"
    k3s_cp_taint_value: "{{ k3s_cp_taint.split('=')[1].split(':')[0] }}"
    k3s_cp_taint_effect: "{{ k3s_cp_taint.split(':')[-1] }}"
    k3s_node: "{{ (k3s_node_meta.stdout | from_json)['items'] | selectattr('metadata.name', 'equalto', item) | first | default({}) }}"
    k3s_node_labels: "{{ (k3s_node.metadata | default({})).labels | default({}) }}"
    k3s_node_taints: "{{ (k3s_node.spec | default({})).taints | default([]) }}"

- name: Cilium 에이전트 (노드마다 하나)
  ansible.builtin.command: /usr/local/bin/k3s kubectl -n kube-system rollout status ds/cilium --timeout=300s
  changed_when: false

- name: Cilium operator
  ansible.builtin.command: /usr/local/bin/k3s kubectl -n kube-system rollout status deploy/cilium-operator --timeout=300s
  changed_when: false

- name: 결과
  ansible.builtin.command: /usr/local/bin/k3s kubectl get nodes -o wide
  register: k3s_nodes_wide
  changed_when: false

- name: 노드 목록
  ansible.builtin.debug:
    var: k3s_nodes_wide.stdout_lines
