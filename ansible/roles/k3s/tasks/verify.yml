# 클러스터마다 -1에서 실행: 내장 etcd, server 3대 Ready, taint 없음, Cilium·Hubble 정상, VIP 한 대, VIP로 API 응답
- name: 내장 etcd 데이터 폴더
  ansible.builtin.stat:
    path: /var/lib/rancher/k3s/server/db/etcd
  register: k3s_etcd_dir

- name: 데이터 저장소가 내장 etcd인지
  ansible.builtin.assert:
    that: k3s_etcd_dir.stat.isdir | default(false)
    fail_msg: "/var/lib/rancher/k3s/server/db/etcd가 없음. k3s가 SQLite로 떠 있을 수 있음 (config.yaml의 cluster-init 확인)"

- name: 노드가 전부 Ready가 될 때까지 대기
  ansible.builtin.command: /usr/local/bin/k3s kubectl get nodes --no-headers
  register: k3s_nodes
  changed_when: false
  retries: "{{ k3s_nodes_ready_retries }}"
  delay: 10
  until: >-
    k3s_nodes.rc == 0 and
    (k3s_nodes.stdout_lines | length) == (k3s_cluster_hosts | length) and
    (k3s_nodes.stdout_lines | select('search', ' Ready ') | list | length) == (k3s_cluster_hosts | length)

- name: 노드 라벨과 taint 읽기
  ansible.builtin.command: /usr/local/bin/k3s kubectl get nodes -o json
  register: k3s_node_meta
  changed_when: false

# 3대 모두 control-plane·etcd 라벨이 true이고, 파드가 뜰 수 있게 control-plane taint가 없음
- name: 3대 모두 server (control-plane, etcd)이고 taint 없음
  ansible.builtin.assert:
    that:
      - k3s_node | length > 0
      - k3s_node_labels['node-role.kubernetes.io/control-plane'] | default('') == 'true'
      - k3s_node_labels['node-role.kubernetes.io/etcd'] | default('') == 'true'
      - k3s_node_taints | selectattr('key', 'equalto', 'node-role.kubernetes.io/control-plane') | list | length == 0
    fail_msg: >-
      {{ item }}: control-plane·etcd 라벨이 true이고 control-plane taint가 없어야 함.
      현재: {{ ('라벨=' ~ (k3s_node_labels | dict2items | selectattr('key', 'search', 'node-role') | items2dict | to_json)
               ~ ', taint=' ~ (k3s_node_taints | to_json)) if k3s_node | length > 0 else '노드 없음' }}
    quiet: true
  loop: "{{ k3s_cluster_hosts }}"
  vars:
    k3s_node: "{{ (k3s_node_meta.stdout | from_json)['items'] | selectattr('metadata.name', 'equalto', item) | first | default({}) }}"
    k3s_node_labels: "{{ (k3s_node.metadata | default({})).labels | default({}) }}"
    k3s_node_taints: "{{ (k3s_node.spec | default({})).taints | default([]) }}"

- name: Cilium, Hubble, Cluster Mesh 구성요소 rollout
  ansible.builtin.command: /usr/local/bin/k3s kubectl -n kube-system rollout status {{ item }} --timeout=300s
  loop: >-
    {{ ['ds/cilium', 'deploy/cilium-operator', 'deploy/hubble-relay', 'deploy/clustermesh-apiserver']
       + (['deploy/hubble-ui'] if k3s_cluster_name == k3s_hubble_ui_cluster else []) }}
  changed_when: false

- name: VIP를 가진 server
  ansible.builtin.command: ip -o -4 addr show dev {{ k3s_vrrp_iface }} to {{ k3s_vip }}/32
  register: k3s_vip_owner
  changed_when: false
  delegate_to: "{{ item }}"
  loop: "{{ k3s_cluster_hosts }}"

- name: VIP는 한 대에만 있어야 함
  ansible.builtin.assert:
    that: k3s_vip_holders | length == 1
    fail_msg: "{{ k3s_vip }}를 가진 server: {{ k3s_vip_holders | join(', ') if k3s_vip_holders else '없음' }} (한 대여야 함)"
    quiet: true
  vars:
    k3s_vip_holders: "{{ k3s_vip_owner.results | selectattr('stdout', 'search', k3s_vip) | map(attribute='item') | list }}"

- name: astra에서 VIP로 API 응답 (받아 둔 kubeconfig)
  ansible.builtin.command: kubectl --kubeconfig {{ k3s_kubeconfig_local }} --request-timeout=10s get --raw /readyz
  register: k3s_vip_api
  changed_when: false
  failed_when: k3s_vip_api.stdout != 'ok'
  delegate_to: localhost
  become: false

- name: 결과
  ansible.builtin.command: /usr/local/bin/k3s kubectl get nodes -o wide
  register: k3s_nodes_wide
  changed_when: false

- name: 노드 목록
  ansible.builtin.debug:
    var: k3s_nodes_wide.stdout_lines
