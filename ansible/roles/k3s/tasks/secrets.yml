# 비밀값 (Vault KV 인프라 구역). 클러스터마다 -1에서 한 번씩 실행 (playbooks/cluster.yml, serial: 1)
#   secret/orbit/infra/k3s-<클러스터 이름>: join 토큰 (token). 없으면 무작위로 만들어 저장
#   secret/orbit/infra/cilium-ca: 4개 클러스터가 함께 쓰는 Cilium CA (ca_crt, ca_key). 첫 클러스터에서만 읽거나 만듦
# Vault API는 Vault 호스트에서 호출 (efk role과 같음). 토큰은 실행하는 쪽의 환경 변수에서 읽어 넘김
- name: VAULT_TOKEN이 있어야 함
  ansible.builtin.assert:
    that: lookup('ansible.builtin.env', 'VAULT_TOKEN') | length > 0
    fail_msg: >-
      VAULT_TOKEN이 없음. join 토큰과 Cilium CA를 Vault({{ hvault_kv_mount }}/{{ hvault_kv_infra_prefix }})에서 읽어야 함.
      ../scripts/orbit-ssh-cert.sh 후 export VAULT_TOKEN=$(cat ~/.orbit/vault-token)
    quiet: true

- name: join 토큰 ({{ k3s_token_vault_path }})
  ansible.builtin.include_role:
    name: efk
    tasks_from: vault-secret.yml
  vars:
    efk_vs_path: "{{ k3s_token_vault_path }}"
    efk_vs_keys: [token]

- name: join 토큰 기억 (-2·-3이 읽음)
  ansible.builtin.set_fact:
    k3s_token: "{{ efk_vs_values.token }}"
  no_log: true

- name: Cilium CA ({{ k3s_cilium_ca_vault_path }})
  when: inventory_hostname == groups['k3s'][0]
  module_defaults:
    ansible.builtin.uri:
      headers:
        X-Vault-Token: "{{ lookup('ansible.builtin.env', 'VAULT_TOKEN') }}"
      ca_path: "{{ hvault_tls_dir }}/vault-ca.crt"
  block:
    - name: 읽기
      ansible.builtin.uri:
        url: "{{ hvault_addr }}/v1/{{ hvault_kv_mount }}/data/{{ k3s_cilium_ca_vault_path }}"
        status_code: [200, 403, 404, 503]
      register: k3s_ca_read
      delegate_to: "{{ hvault_host }}"
      become: false
      check_mode: false   # 읽기만 함
      no_log: true

    - name: 읽을 수 있어야 함 (없으면 404라 처음 만듦)
      ansible.builtin.assert:
        that: k3s_ca_read.status in [200, 404]
        fail_msg: >-
          {{ 'Vault가 sealed 상태. 먼저 unseal' if k3s_ca_read.status == 503
             else ('VAULT_TOKEN에 ' ~ hvault_kv_mount ~ '/' ~ k3s_cilium_ca_vault_path ~ ' 권한이 없거나 토큰이 만료됨 (' ~ k3s_ca_read.status ~ ')') }}
        quiet: true

    # 키와 인증서는 파일로 남기지 않음 (pipe 모듈은 결과를 변수로만 돌려줌). Cilium chart가 RSA PKCS#1 키를 읽음
    - name: 새 CA 만들기 (Vault에 없을 때만)
      when: k3s_ca_read.status == 404
      delegate_to: "{{ hvault_host }}"
      become: false
      block:
        - name: 새로 만듦을 표시
          ansible.builtin.debug:
            msg: "Vault {{ hvault_kv_mount }}/{{ k3s_cilium_ca_vault_path }}에 새 Cilium CA를 만듦"

        - name: CA 키
          community.crypto.openssl_privatekey_pipe:
            type: RSA
            size: 2048
            format: pkcs1
          register: k3s_ca_key
          check_mode: false   # 서버를 바꾸지 않음
          no_log: true

        - name: CA 서명 요청
          community.crypto.openssl_csr_pipe:
            privatekey_content: "{{ k3s_ca_key.privatekey }}"
            common_name: Cilium CA
            basic_constraints: [CA:TRUE]
            basic_constraints_critical: true
            key_usage: [keyCertSign, cRLSign, digitalSignature]
            key_usage_critical: true
          register: k3s_ca_csr
          check_mode: false
          no_log: true

        - name: CA 인증서 (자체 서명)
          community.crypto.x509_certificate_pipe:
            provider: selfsigned
            csr_content: "{{ k3s_ca_csr.csr }}"
            privatekey_content: "{{ k3s_ca_key.privatekey }}"
            selfsigned_not_after: "+{{ k3s_cilium_ca_days }}d"
          register: k3s_ca_cert
          check_mode: false
          no_log: true

        # cas 0: 그 사이 다른 사람이 만들었으면 실패함 (덮어쓰지 않음)
        - name: Vault에 저장
          ansible.builtin.uri:
            url: "{{ hvault_addr }}/v1/{{ hvault_kv_mount }}/data/{{ k3s_cilium_ca_vault_path }}"
            method: POST
            body_format: json
            body:
              options: { cas: 0 }
              data: { ca_crt: "{{ k3s_ca_cert.certificate }}", ca_key: "{{ k3s_ca_key.privatekey }}" }
          changed_when: true
          when: not ansible_check_mode
          no_log: true

    - name: Cilium CA 기억 (모든 클러스터의 Cilium HelmChart가 읽음)
      ansible.builtin.set_fact:
        k3s_cilium_ca:
          crt: "{{ k3s_ca_read.json.data.data.ca_crt if k3s_ca_read.status == 200 else k3s_ca_cert.certificate }}"
          key: "{{ k3s_ca_read.json.data.data.ca_key if k3s_ca_read.status == 200 else k3s_ca_key.privatekey }}"
      no_log: true
