- name: restart k3s
  ansible.builtin.systemd_service:
    name: k3s
    state: restarted
  when: k3s_installed.rc == 0 and not ansible_check_mode   # 처음 설치 때는 설치 스크립트가 시작함

- name: restart keepalived
  ansible.builtin.systemd_service:
    name: keepalived
    state: restarted
  when: not ansible_check_mode
