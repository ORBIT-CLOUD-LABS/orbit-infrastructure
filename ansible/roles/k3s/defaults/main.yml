k3s_install_url: https://get.k3s.io
k3s_install_script: /usr/local/bin/k3s-install.sh
k3s_data_mount: /var/lib/rancher          # polaris는 NVMe가 여기 붙어 있어야 함 (etcd)
k3s_skip_bpf_check: false                 # polaris 커널 BPF 확인을 건너뛸 때만 true
k3s_kernel_opts:                          # Cilium(eBPF)에 필요한 커널 기능. =y 또는 =m
  - BPF
  - BPF_SYSCALL
  - BPF_JIT
  - CGROUP_BPF
  - NET_CLS_BPF
  - NET_CLS_ACT
  - NET_SCH_INGRESS
  - VXLAN
  - CRYPTO_USER_API_HASH
  - PERF_EVENTS
k3s_nodes_ready_retries: 30               # 노드 Ready 대기 (10초 간격)
k3s_kubeconfig_local: "{{ lookup('env', 'HOME') }}/.kube/orbit-k3s.yaml"   # 실행하는 쪽(astra)에 받아 둘 kubeconfig
