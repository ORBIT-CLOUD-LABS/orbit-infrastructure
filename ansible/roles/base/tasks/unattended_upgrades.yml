---
- name: Install unattended-upgrades
  ansible.builtin.apt:
    name: unattended-upgrades
    state: present

# apt.conf.d는 파일명 순서로 읽고 뒤에 읽은 값이 앞의 값을 덮어쓴다.
# 20auto-upgrades, 50unattended-upgrades(패키지 기본 파일)는 그대로 두고 그 뒤에 읽히는 파일로 고정한다.
- name: Configure unattended-upgrades
  ansible.builtin.template:
    src: unattended-upgrades.conf.j2
    dest: /etc/apt/apt.conf.d/60orbit-unattended-upgrades
    owner: root
    group: root
    mode: "0644"
    validate: apt-config -c %s dump
