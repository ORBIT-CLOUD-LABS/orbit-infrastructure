# Elasticsearch가 먼저 재시작되도록 순서대로 둠 (handler는 정의된 순서로 실행)
- name: restart elasticsearch
  ansible.builtin.systemd_service:
    name: elasticsearch
    state: restarted
    daemon_reload: true
  when: not ansible_check_mode

- name: restart kibana
  ansible.builtin.systemd_service:
    name: kibana
    state: restarted
  when: not ansible_check_mode

# 재부팅 뒤에도 유지 (gateway·vault role과 같은 명령)
- name: save efk firewall
  ansible.builtin.command: netfilter-persistent save
  changed_when: true
