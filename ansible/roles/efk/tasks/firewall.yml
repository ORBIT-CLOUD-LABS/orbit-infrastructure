# efk: 9200(Elasticsearch)·5601(Kibana)은 허용한 출발지에서만 받음
# INPUT 기본 정책이 ACCEPT라서 전용 체인에서 허용 후 나머지는 버림. 다른 포트(22 등)는 그대로
# 규칙을 하나씩 넣으면 위치와 지운 항목이 교정되지 않아서, 전체를 비교하고 다르면 한 번에 바꿈 (vault role과 같은 방식)

# ufw는 꺼져 있고 iptables-persistent와 함께 설치할 수 없음(Breaks). 설치하면서 apt가 ufw를 지움
- name: iptables-persistent 질문 미리 답하기
  ansible.builtin.debconf:
    name: iptables-persistent
    question: "{{ item }}"
    value: "true"
    vtype: boolean
  loop: [iptables-persistent/autosave_v4, iptables-persistent/autosave_v6]

- name: iptables-persistent 설치 (재부팅 뒤에도 규칙 유지. 쓰지 않는 ufw는 지워짐)
  ansible.builtin.apt:
    name: iptables-persistent
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: 원하는 규칙 (iptables -S 형식)
  ansible.builtin.set_fact:
    # lint는 인벤토리 없이 템플릿을 시험해서 groups·hostvars를 풀지 못함. 실제 렌더링은 확인함
    efk_fw_chain: >-   # noqa: jinja[invalid]
      {{ ['-N ' ~ efk_fw_chain_name, '-A ' ~ efk_fw_chain_name ~ ' -i lo -j ACCEPT']
         + efk_fw_accept
         + ['-A ' ~ efk_fw_chain_name ~ ' -j DROP'] }}
    efk_fw_jump: >-
      -A INPUT -p tcp -m multiport --dports {{ efk_fw_allow | map(attribute='port') | sort | join(',') }} -j {{ efk_fw_chain_name }}
  vars:
    # 자기 자신(lo)은 허용. 검증과 Kibana가 efk 안에서 9200에 접속함
    # (포트, 호스트) 쌍마다 "-s <lan_ip>/32 --dport <포트>" 허용 규칙 하나
    efk_fw_pairs: "{{ efk_fw_allow | subelements('hosts') }}"   # noqa: jinja[invalid]
    efk_fw_accept: >-   # noqa: jinja[invalid]
      {{ efk_fw_pairs | map('last') | map('extract', hostvars, 'lan_ip')
         | zip(efk_fw_pairs | map('first') | map(attribute='port'))
         | map('join', '/32 -p tcp -m tcp --dport ')
         | map('regex_replace', '^', '-A ' ~ efk_fw_chain_name ~ ' -s ')
         | map('regex_replace', '$', ' -j ACCEPT')
         | list }}

- name: 지금 규칙 읽기
  ansible.builtin.command: iptables -S
  register: efk_fw_now
  changed_when: false
  check_mode: false

- name: 지금 규칙 나누기
  ansible.builtin.set_fact:
    efk_fw_chain_now: "{{ efk_fw_now.stdout_lines | select('match', '-(N|A) ' ~ efk_fw_chain_name ~ '( |$)') | list }}"
    efk_fw_input_now: "{{ efk_fw_now.stdout_lines | select('match', '-A INPUT ') | list }}"

# 체인 내용이 다르거나, 연결 규칙이 INPUT 맨 앞에 하나만 있지 않으면 교체
- name: 바꿔야 하는지
  ansible.builtin.set_fact:
    efk_fw_needs_change: >-
      {{ efk_fw_chain_now != efk_fw_chain or
         (efk_fw_input_now | first | default('')) != efk_fw_jump or
         (efk_fw_input_now | select('equalto', efk_fw_jump) | list | length) != 1 }}

# command는 미리보기에서 건너뛰어서, 바뀔 예정인지와 적용할 내용을 따로 보여 줌
- name: 미리보기 (바뀔 규칙)
  ansible.builtin.debug:
    msg: "{{ lookup('ansible.builtin.template', 'efk-firewall.rules.j2').splitlines() }}"
  when: ansible_check_mode and efk_fw_needs_change
  changed_when: true

# iptables-restore는 한 번에 적용해서, 바꾸는 사이에 포트가 열리는 순간이 없음
- name: 다르면 한 번에 바꾸기
  ansible.builtin.command:
    cmd: iptables-restore --noflush
    stdin: "{{ lookup('ansible.builtin.template', 'efk-firewall.rules.j2') }}"
  when: efk_fw_needs_change
  changed_when: true
  notify: save efk firewall

- name: 다시 읽기
  ansible.builtin.command: iptables -S
  register: efk_fw_after
  changed_when: false
  when: not ansible_check_mode

- name: 원하는 모양인지 확인
  ansible.builtin.assert:
    that:
      - (efk_fw_after.stdout_lines | select('match', '-(N|A) ' ~ efk_fw_chain_name ~ '( |$)') | list) == efk_fw_chain
      - (efk_fw_after.stdout_lines | select('match', '-A INPUT ') | first) == efk_fw_jump
    fail_msg: "efk 방화벽 규칙이 원하는 모양이 아님. sudo iptables -S INPUT; sudo iptables -S {{ efk_fw_chain_name }} 확인"
  when: not ansible_check_mode
