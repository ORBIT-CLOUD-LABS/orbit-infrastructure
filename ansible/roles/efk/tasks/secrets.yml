# Vault KV에서 비밀번호와 Kibana 암호화 키를 읽음. 경로 두 곳
#   인프라 구역 secret/orbit/infra/efk: 관리자·Kibana·호스트 수집·조회 계정 (ESO는 읽지 못함)
#   k3s 구역 secret/orbit/k3s/fluent-bit: k3s Fluent Bit 쓰기 계정 (ESO가 읽어 k3s Secret으로 만듦)
# 없는 키만 무작위로 만들어 Vault에 먼저 저장한 뒤 사용. 있는 값은 바꾸지 않음
# Vault API는 astra에서 호출 (ssh_ca role과 같음). 토큰은 실행하는 쪽의 환경 변수에서 읽어 넘김
# 토큰: 팀원 GitHub 로그인 토큰(orbit-secrets-write 정책)으로 충분함
- name: VAULT_TOKEN이 있어야 함
  ansible.builtin.assert:
    that: lookup('ansible.builtin.env', 'VAULT_TOKEN') | length > 0
    fail_msg: >-
      VAULT_TOKEN이 없음. Elasticsearch·Kibana 비밀번호를 Vault({{ hvault_kv_mount }}/{{ efk_vault_path }})에서 읽어야 함.
      ../scripts/orbit-ssh-cert.sh 후 export VAULT_TOKEN=$(cat ~/.orbit/vault-token)
    quiet: true

- name: 인프라 구역 ({{ efk_vault_path }})
  ansible.builtin.include_tasks: vault-secret.yml
  vars:
    efk_vs_path: "{{ efk_vault_path }}"
    efk_vs_keys: "{{ efk_secret_keys }}"

- name: 인프라 구역 값
  ansible.builtin.set_fact:
    efk_secrets: "{{ efk_vs_values }}"
    efk_secrets_infra_ready: "{{ efk_vs_ready }}"
  no_log: true

- name: k3s 구역 ({{ efk_k8s_vault_path }})
  ansible.builtin.include_tasks: vault-secret.yml
  vars:
    efk_vs_path: "{{ efk_k8s_vault_path }}"
    efk_vs_keys: "{{ efk_k8s_secret_keys }}"

# 미리보기에서 새로 만든 값은 Vault에 없으므로 계정 설정을 건너뜀
- name: k3s 구역 값
  ansible.builtin.set_fact:
    efk_k8s_secrets: "{{ efk_vs_values }}"
    efk_secrets_ready: "{{ efk_secrets_infra_ready and efk_vs_ready }}"
  no_log: true
