# 패키지는 처음 설치할 때 보안을 자동 구성함 (자체 인증서 생성, elastic 비밀번호를 만들어 설치 출력과 apt 로그에 남김)
# elasticsearch.yml에 xpack.security.enabled가 이미 있으면 건너뛰므로, 설정 파일을 패키지보다 먼저 둠
# 그래서 패키지가 만드는 계정·폴더를 같은 방식(preinst)으로 미리 만듦
- name: elasticsearch 그룹
  ansible.builtin.group:
    name: elasticsearch
    system: true

- name: elasticsearch 계정
  ansible.builtin.user:
    name: elasticsearch
    group: elasticsearch
    system: true
    create_home: false
    home: /nonexistent
    shell: /bin/false
    password: "!"

- name: 설정 폴더
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: elasticsearch
    mode: "2750"
  loop:
    - /etc/elasticsearch
    - /etc/elasticsearch/jvm.options.d

# 패키지에 같은 이름의 conffile이 있음. apt 모듈은 기본으로 force-confold라 이 파일을 유지함
- name: Elasticsearch 설정
  ansible.builtin.template:
    src: elasticsearch.yml.j2
    dest: /etc/elasticsearch/elasticsearch.yml
    owner: root
    group: elasticsearch
    mode: "0660"
  notify: restart elasticsearch

- name: 힙 크기 (최소 = 최대)
  ansible.builtin.copy:
    dest: /etc/elasticsearch/jvm.options.d/orbit-heap.options
    content: |
      # Ansible managed (roles/efk)
      -Xms{{ efk_es_heap }}
      -Xmx{{ efk_es_heap }}
    owner: root
    group: elasticsearch
    mode: "0660"
  notify: restart elasticsearch

# 미리보기에서 저장소가 아직 없으면 건너뜀 (main.yml의 efk_skip_install)
- name: 설치와 버전 고정
  when: not efk_skip_install
  block:
    - name: Elasticsearch 설치 {{ efk_version }}
      ansible.builtin.apt:
        name: "elasticsearch={{ efk_version }}"
        state: present
        update_cache: true
        allow_change_held_packages: true   # 버전을 바꿀 때만 hold를 넘어 설치함
      notify: restart elasticsearch

    - name: apt upgrade로 버전이 바뀌지 않게 고정
      ansible.builtin.dpkg_selections:
        name: elasticsearch
        selection: hold

# 설정 파일이 있어도 자동 구성이 돌았다면 certs 폴더와 keystore 항목이 생김. 그 상태로는 이 role의 TLS와 섞이므로 멈춤
- name: 보안 자동 구성이 돌지 않았는지
  ansible.builtin.stat:
    path: /etc/elasticsearch/certs
  register: efk_auto_certs

- name: 돌았으면 멈춤
  ansible.builtin.assert:
    that: not efk_auto_certs.stat.exists
    fail_msg: >-
      /etc/elasticsearch/certs가 있음. 패키지의 보안 자동 구성이 실행된 상태라
      certs 폴더와 elasticsearch-keystore의 xpack.security.*.ssl.*, autoconfiguration.password_hash 항목을 확인 후 지우고 다시 실행

- name: Elasticsearch 서비스 켜기
  ansible.builtin.systemd_service:
    name: elasticsearch
    enabled: true
    state: started
    daemon_reload: true
  when: not ansible_check_mode   # 미리보기 첫 실행에서는 서비스가 아직 없음
