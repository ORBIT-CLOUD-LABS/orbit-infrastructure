# Vault KV 한 경로를 읽고, 없는 키는 무작위 값(영문·숫자 40자)으로 만들어 저장
# 입력: efk_vs_path, efk_vs_keys. 결과: efk_vs_values(전체 값), efk_vs_ready(미리보기에서 새로 만든 값이 없으면 true)
- name: Vault API 호출 (토큰과 비밀값은 출력에 남기지 않음)
  delegate_to: "{{ hvault_host }}"
  become: false
  run_once: true
  module_defaults:
    ansible.builtin.uri:
      headers:
        X-Vault-Token: "{{ lookup('ansible.builtin.env', 'VAULT_TOKEN') }}"
      ca_path: "{{ efk_vault_ca }}"
      body_format: json
  block:
    - name: 읽기
      ansible.builtin.uri:
        url: "{{ hvault_addr }}/v1/{{ hvault_kv_mount }}/data/{{ efk_vs_path }}"
        status_code: [200, 403, 404, 503]
      register: efk_vault_read
      check_mode: false   # 읽기만 함
      no_log: true

    - name: 읽을 수 있어야 함 (없으면 404라 처음 만듦)
      ansible.builtin.assert:
        that: efk_vault_read.status in [200, 404]
        fail_msg: >-
          {{ 'Vault가 sealed 상태. 먼저 unseal' if efk_vault_read.status == 503
             else ('VAULT_TOKEN에 ' ~ hvault_kv_mount ~ '/' ~ efk_vs_path ~ ' 권한이 없거나 토큰이 만료됨 (' ~ efk_vault_read.status ~ ')') }}
        quiet: true

    - name: 지금 값
      ansible.builtin.set_fact:
        efk_vault_old: "{{ efk_vault_read.json.data.data if efk_vault_read.status == 200 else {} }}"
        efk_vault_version: "{{ efk_vault_read.json.data.metadata.version if efk_vault_read.status == 200 else 0 }}"
        efk_vault_new: {}
      no_log: true

    - name: 없는 키
      ansible.builtin.set_fact:
        efk_vault_missing: "{{ efk_vs_keys | difference(efk_vault_old.keys() | list) }}"

    - name: 새로 만들 키 (이름만 표시)
      ansible.builtin.debug:
        msg: "Vault {{ hvault_kv_mount }}/{{ efk_vs_path }}에 새로 만듦: {{ efk_vault_missing | join(', ') }}"
      when: efk_vault_missing | length > 0

    - name: 없는 키는 무작위 값 (영문·숫자 40자)
      ansible.builtin.set_fact:
        efk_vault_new: >-
          {{ efk_vault_new | combine({item: lookup('ansible.builtin.password', '/dev/null',
             length=40, chars=['ascii_letters', 'digits'])}) }}
      loop: "{{ efk_vault_missing }}"
      no_log: true

    # cas: 읽은 뒤 다른 사람이 바꿨으면 실패함 (덮어쓰지 않음). 기존 키는 그대로 함께 씀
    - name: Vault에 저장
      ansible.builtin.uri:
        url: "{{ hvault_addr }}/v1/{{ hvault_kv_mount }}/data/{{ efk_vs_path }}"
        method: POST
        body:
          options: { cas: "{{ efk_vault_version | int }}" }
          data: "{{ efk_vault_old | combine(efk_vault_new) }}"
      when: efk_vault_missing | length > 0 and not ansible_check_mode
      changed_when: true
      no_log: true

    - name: 결과
      ansible.builtin.set_fact:
        efk_vs_values: "{{ efk_vault_old | combine(efk_vault_new) }}"
        efk_vs_ready: "{{ not (ansible_check_mode and efk_vault_missing | length > 0) }}"
      no_log: true
