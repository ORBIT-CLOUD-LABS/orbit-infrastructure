# astra(서브넷 라우터)에서 실행. tailnet → efk 통과를 efk_ts_allow_ports와 ping만으로 제한
# Tailscale ACL과 별개로 한 번 더 막음. ACL을 넓혀도 tailnet에서 efk 9200에는 닿지 않음
# 규칙 전체를 비교하고 다르면 iptables-restore로 한 번에 바꿈 (vault·efk 방화벽과 같은 방식)
- name: 규칙 저장 도구가 있어야 함 (gateway role이 설치)
  ansible.builtin.stat:
    path: /usr/sbin/netfilter-persistent
  register: efk_ts_nfp

- name: 없으면 멈춤
  ansible.builtin.assert:
    that: efk_ts_nfp.stat.exists
    fail_msg: "netfilter-persistent 없음. 먼저 ansible-playbook playbooks/network.yml --limit astra"

- name: 원하는 규칙 (iptables -t mangle -S 형식)
  ansible.builtin.set_fact:
    efk_ts_chain:
      - "-N {{ efk_ts_chain_name }}"
      - "-A {{ efk_ts_chain_name }} -p tcp -m multiport --dports {{ efk_ts_allow_ports | sort | join(',') }} -j RETURN"
      - "-A {{ efk_ts_chain_name }} -p icmp -j RETURN"
      - "-A {{ efk_ts_chain_name }} -j DROP"
    efk_ts_jump: "-A FORWARD -d {{ hostvars['efk'].lan_ip }}/32 -i {{ efk_ts_iface }} -j {{ efk_ts_chain_name }}"

- name: 지금 규칙 읽기
  ansible.builtin.command: iptables -t mangle -S
  register: efk_ts_now
  changed_when: false
  check_mode: false

- name: 지금 규칙 나누기
  ansible.builtin.set_fact:
    efk_ts_chain_now: "{{ efk_ts_now.stdout_lines | select('match', '-(N|A) ' ~ efk_ts_chain_name ~ '( |$)') | list }}"
    efk_ts_fwd_now: "{{ efk_ts_now.stdout_lines | select('match', '-A FORWARD ') | list }}"

- name: 바꿔야 하는지
  ansible.builtin.set_fact:
    efk_ts_needs_change: >-
      {{ efk_ts_chain_now != efk_ts_chain or
         (efk_ts_fwd_now | first | default('')) != efk_ts_jump or
         (efk_ts_fwd_now | select('equalto', efk_ts_jump) | list | length) != 1 }}

- name: 미리보기 (바뀔 규칙)
  ansible.builtin.debug:
    msg: "{{ lookup('ansible.builtin.template', 'efk-tailnet-forward.rules.j2').splitlines() }}"
  when: ansible_check_mode and efk_ts_needs_change
  changed_when: true

- name: 다르면 한 번에 바꾸기
  ansible.builtin.command:
    cmd: iptables-restore --noflush
    stdin: "{{ lookup('ansible.builtin.template', 'efk-tailnet-forward.rules.j2') }}"
  when: efk_ts_needs_change
  changed_when: true
  notify: save efk firewall

- name: 다시 읽기
  ansible.builtin.command: iptables -t mangle -S
  register: efk_ts_after
  changed_when: false
  when: not ansible_check_mode

- name: 원하는 모양인지 확인
  ansible.builtin.assert:
    that:
      - (efk_ts_after.stdout_lines | select('match', '-(N|A) ' ~ efk_ts_chain_name ~ '( |$)') | list) == efk_ts_chain
      - (efk_ts_after.stdout_lines | select('match', '-A FORWARD ') | first) == efk_ts_jump
    fail_msg: "tailnet → efk 통과 규칙이 원하는 모양이 아님. sudo iptables -t mangle -S 확인"
  when: not ansible_check_mode
