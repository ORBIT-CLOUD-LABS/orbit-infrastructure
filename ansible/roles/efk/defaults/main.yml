efk_version: 9.5.6                        # 버전 고정. Elasticsearch와 Kibana는 같은 버전으로 맞춤
efk_repo_url: https://artifacts.elastic.co/packages/9.x/apt
efk_cluster_name: orbit-efk
efk_es_heap: 4g                           # VM 20GB 중 Elasticsearch 8GB 예산의 절반. 나머지는 파일 캐시
efk_es_data_dir: /var/lib/elasticsearch
efk_es_log_dir: /var/log/elasticsearch
efk_es_http_hosts: ["127.0.0.1", "{{ lan_ip }}"]   # 9200 (HTTPS). 노드 간 통신(9300)은 단일 노드라 127.0.0.1에만
efk_kibana_host: "{{ lan_ip }}"                    # 5601 (HTTPS)
efk_url: "https://{{ lan_ip }}:9200"
efk_kibana_url: "https://{{ lan_ip }}:5601"
efk_kibana_public_url: "https://kibana.{{ orbit_domain }}"   # Kibana가 링크를 만들 때 쓰는 주소 (astra 내부 리버스 프록시, docs/reverse-proxy.md)

# TLS. 자체 CA로 Elasticsearch·Kibana 서버 인증서를 발급. 송신기(Fluent Bit)와 Kibana는 efk-ca.crt로 검증
efk_es_tls_dir: /etc/elasticsearch/tls    # Elasticsearch는 설정 폴더 안의 파일만 읽음
efk_kibana_tls_dir: /etc/kibana/tls
efk_ca_path: "{{ efk_es_tls_dir }}/efk-ca.crt"   # 공개용. 송신기에 나눠 줄 CA
efk_tls_ca_days: 3650
efk_tls_cert_days: 825
efk_tls_sans: ["DNS:{{ inventory_hostname }}", "DNS:localhost", "IP:127.0.0.1", "IP:{{ lan_ip }}"]

# 비밀값: Vault KV 인프라 구역 (ESO는 읽지 못함). 없는 키는 처음 실행할 때 무작위로 만들어 Vault에 먼저 저장
efk_vault_path: "{{ hvault_kv_infra_prefix }}/efk"          # secret/orbit/infra/efk
efk_vault_ca: "{{ hvault_tls_dir }}/vault-ca.crt"           # Vault API는 astra에서 호출 (어디서 실행하든 같은 CA 경로)
efk_secret_keys:
  - elastic_password            # 관리자. Ansible이 역할·템플릿·ILM을 만들 때
  - kibana_system_password      # Kibana가 Elasticsearch에 접속할 때
  - kibana_security_key         # Kibana 로그인 세션 암호화 (재시작해도 로그인 유지)
  - kibana_saved_objects_key    # Kibana 저장 객체 암호화
  - kibana_reporting_key        # Kibana 보고서 암호화
  - fluentbit_host_password     # astra·VM Fluent Bit (orbit-host-* 쓰기)
  - kibana_viewer_password      # 사람이 Kibana에서 조회
  - grafana_viewer_password     # Grafana 데이터 소스
# k3s Fluent Bit 쓰기 계정은 k3s 구역에 둠. ESO가 읽어 k3s Secret으로 만듦 (orbit-gitops#46). 계정명은 비밀이 아니라 저장하지 않음
efk_k8s_vault_path: "{{ hvault_kv_k3s_prefix }}/fluent-bit"   # secret/orbit/k3s/fluent-bit
efk_k8s_secret_keys: [password]

# 역할. Fluent Bit은 날짜별 인덱스를 새로 만들고 문서를 추가만 함 (수정·삭제·읽기 없음)
# 템플릿·ILM 관리는 elastic(Ansible)만. GET으로 읽은 값과 비교하려고 Elasticsearch가 돌려주는 형태로 씀
# 쓰기 계정은 보내는 곳으로 나눔. k3s DaemonSet은 Pod 로그(orbit-k8s-*)와 노드 journald(orbit-host-*)를 함께 보냄 (orbit-gitops#46)
efk_roles:
  orbit_k8s_writer:
    cluster: []
    indices:
      - { names: ["orbit-k8s-*", "orbit-host-*"], privileges: [create_doc, create_index], allow_restricted_indices: false }
    applications: []
    run_as: []
  orbit_host_writer:
    cluster: []
    indices:
      - { names: ["orbit-host-*"], privileges: [create_doc, create_index], allow_restricted_indices: false }
    applications: []
    run_as: []
  # Kibana 기본 공간 읽기 전용 (Discover·대시보드 보기). 데이터 뷰 등 저장 객체는 만들지 못함
  orbit_log_viewer:
    cluster: []
    indices:
      - { names: ["orbit-k8s-*", "orbit-host-*"], privileges: [read, view_index_metadata], allow_restricted_indices: false }
    applications:
      - { application: kibana-.kibana, privileges: [space_read], resources: ["space:default"] }
    run_as: []
  # Grafana 데이터 소스. 연결 확인에 클러스터 상태(monitor)를 읽음
  orbit_grafana_viewer:
    cluster: [monitor]
    indices:
      - { names: ["orbit-k8s-*", "orbit-host-*"], privileges: [read, view_index_metadata], allow_restricted_indices: false }
    applications: []
    run_as: []

# 계정. 비밀번호는 vault(infra: secret/orbit/infra/efk, k8s: secret/orbit/k3s/fluent-bit)의 key
efk_users:
  - { name: fluentbit_k8s, roles: [orbit_k8s_writer], vault: k8s, key: password }
  - { name: fluentbit_host, roles: [orbit_host_writer], vault: infra, key: fluentbit_host_password }
  - { name: kibana_viewer, roles: [orbit_log_viewer], vault: infra, key: kibana_viewer_password }
  - { name: grafana_viewer, roles: [orbit_grafana_viewer], vault: infra, key: grafana_viewer_password }

# 확인용 (verify.yml). 계정마다 위 4가지 중 허용돼야 하는 것만 적음. 나머지는 거부돼야 함
efk_privilege_checks:
  - { priv: create_doc, index: orbit-k8s-check }
  - { priv: create_doc, index: orbit-host-check }
  - { priv: read, index: orbit-k8s-check }
  - { priv: read, index: orbit-host-check }
efk_privilege_expect:
  fluentbit_k8s: ["create_doc orbit-k8s-check", "create_doc orbit-host-check"]   # Pod 로그 + 노드 journald
  fluentbit_host: ["create_doc orbit-host-check"]
  kibana_viewer: ["read orbit-k8s-check", "read orbit-host-check"]
  grafana_viewer: ["read orbit-k8s-check", "read orbit-host-check"]

# 인덱스: 날짜별(orbit-k8s-YYYY.MM.DD, orbit-host-YYYY.MM.DD), primary 1·replica 0, 만든 지 7일 뒤 삭제
# rollover·쓰기 alias 없음. 템플릿을 바꾸면 그 뒤에 새로 만들어지는 인덱스(보통 다음 날)부터 적용됨
efk_ilm_policy: orbit-logs-7d
efk_retention: 7d
efk_index_template: orbit-logs
efk_index_patterns: ["orbit-k8s-*", "orbit-host-*"]

# 명시한 필드만 검색·집계용으로 색인. 나머지는 dynamic false라 _source에만 남음
# ignore_malformed: 숫자 필드에 "-" 같은 값이 와도 문서 전체를 거부하지 않고 그 필드만 버림
# 이름이 같은 필드를 문자열과 객체로 섞어 보내면(예: host가 문자열) 문서가 거부되므로 송신 측은 아래 이름을 따름
# 값은 Elasticsearch가 돌려주는 형식(설정 값은 문자열, dynamic은 "false")으로 써서 실제 값과 그대로 비교함
efk_index_settings:
  index:
    number_of_shards: "1"
    number_of_replicas: "0"
    lifecycle: { name: "{{ efk_ilm_policy }}" }
    mapping: { ignore_malformed: "true" }
efk_index_mappings:
  dynamic: "false"
  properties:
    "@timestamp": { type: date }
    message: { type: match_only_text }        # 원문. k3s 컨테이너 log도 message로 바꿔 보냄
    level: { type: keyword }                  # 정규화한 로그 레벨 (debug, info, warn, error 등)
    stream: { type: keyword }                 # stdout, stderr
    host:
      properties:
        name: { type: keyword }               # 보낸 호스트 (노드·VM 이름)
    kubernetes:
      properties:
        namespace_name: { type: keyword }
        pod_name: { type: keyword }
        container_name: { type: keyword }
        host: { type: keyword }
        labels: { type: flattened }           # 키에 점·슬래시가 있어도 충돌 없음. kubernetes.labels.app으로 검색
    systemd:
      properties:
        unit: { type: keyword }               # journald _SYSTEMD_UNIT
    syslog:
      properties:
        identifier: { type: keyword }         # journald SYSLOG_IDENTIFIER (sudo 등)
        priority: { type: byte }              # journald PRIORITY (0 emerg ~ 7 debug, 4 이하가 warning 이상)
    file:
      properties:
        path: { type: keyword }               # 파일 입력의 원본 경로 (astra qemu 로그)
    parsed:
      properties:
        nginx:
          properties:
            status: { type: long }
            bytes: { type: long }             # 응답 본문 크기 ($body_bytes_sent)
            cache: { type: keyword }
        server:
          type: object                        # 서버 로그 파싱 결과. 필드를 정하면 여기에 추가

# Kibana 데이터 뷰. 조회 계정은 읽기만 되므로 Ansible이 만들어 둠
efk_data_views:
  - { id: orbit-k8s, name: "orbit-k8s (k3s Pod)", title: "orbit-k8s-*" }
  - { id: orbit-host, name: "orbit-host (호스트 journald·파일)", title: "orbit-host-*" }

# 방화벽: 9200·5601만 허용한 출발지에서 받고 나머지는 버림 (전용 체인 ORBIT-EFK). 22 등 다른 포트는 건드리지 않음
# astra 서브넷 라우터가 SNAT하므로 Tailscale 팀원 접속도 astra(10.0.0.201)로 보임. tailnet에서 9200을 막는 건 astra 쪽 몫
efk_fw_chain_name: ORBIT-EFK
efk_fw_allow:
  - { port: 9200, hosts: "{{ groups['k3s'] + ['astra', 'lgtm', 'wazuh'] }}" }   # 송신(k3s, astra, VM)과 Grafana 조회(lgtm)
  - { port: 5601, hosts: [astra] }                                              # 팀원은 astra를 거쳐 접속

# astra: tailnet(tailscale0)에서 efk로 통과하는 접속은 아래 TCP 포트와 ping만. 9200 등 나머지는 astra에서 버림
# efk에서는 SNAT 때문에 tailnet 접속과 astra 자신이 같은 IP로 보여서, 이 구분은 astra에서만 할 수 있음
# Tailscale은 재시작할 때 filter 표 FORWARD 맨 앞에 tailnet 통과를 허용하는 ts-forward를 다시 넣음
# 그래서 filter보다 먼저 보는 mangle 표에 둠. mangle에서 버린 패킷은 뒤의 허용 규칙과 관계없이 버려짐
efk_ts_chain_name: ORBIT-TS-EFK
efk_ts_iface: tailscale0
efk_ts_allow_ports: [22, 5601]   # SSH(개인 계정), Kibana
