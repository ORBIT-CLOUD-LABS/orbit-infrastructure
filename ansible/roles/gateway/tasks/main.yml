# astra: 안쪽(내부망 br0, 바깥 구역 브리지) 패킷을 와이파이로 내보내는 NAT
- name: 장치 확인
  ansible.builtin.include_role:
    name: network
    tasks_from: facts.yml

- name: 와이파이 장치가 있어야 NAT 가능
  ansible.builtin.assert:
    that: wifi_if | length > 0
    fail_msg: "{{ inventory_hostname }}: 와이파이 MAC {{ wifi_mac }} 장치를 못 찾음"

- name: 패킷 전달 켜기 (재부팅 후에도 유지)
  ansible.builtin.copy:
    dest: /etc/sysctl.d/99-orbit-forward.conf
    content: "net.ipv4.ip_forward=1\n"
    mode: "0644"
  notify: apply sysctl

- name: iptables-persistent 질문 미리 답하기
  ansible.builtin.debconf:
    name: iptables-persistent
    question: "{{ item }}"
    value: "true"
    vtype: boolean
  loop: [iptables-persistent/autosave_v4, iptables-persistent/autosave_v6]

- name: iptables-persistent 설치
  ansible.builtin.apt:
    name: iptables-persistent
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: 통과 허용 규칙을 넣을 체인 (Docker가 있으면 DOCKER-USER)
  ansible.builtin.command: iptables -nL DOCKER-USER
  register: docker_user
  changed_when: false
  failed_when: false
  check_mode: false     # 읽기만 함. 미리보기에서도 실행

- name: 체인 정하기
  ansible.builtin.set_fact:
    fwd_chain: "{{ 'DOCKER-USER' if docker_user.rc == 0 else 'FORWARD' }}"

# 안쪽 장치와 대역의 짝. 옛 내부망은 br0에서만 (옛 대역 정리 때 old_lan_net과 함께 없어짐)
# 바깥 브리지로는 fw 쌍이 바깥 VIP로 SNAT한 구역 통신과 io가 나감
- name: NAT 대상
  ansible.builtin.set_fact:
    gw_nets: "{{ [lan_net] + ([old_lan_net] if old_lan_net is defined else []) }}"
    gw_inner_devs: "{{ [lan_dev] + ([outer_bridge] if outer_bridge is defined else []) }}"
    gw_pass: >-
      {{ [{'dev': lan_dev, 'net': lan_net}]
         + ([{'dev': lan_dev, 'net': old_lan_net}] if old_lan_net is defined else [])
         + ([{'dev': outer_bridge, 'net': lan_net}] if outer_bridge is defined else []) }}

- name: NAT (안에서 나가는 패킷의 출발지를 astra 와이파이 주소로)
  ansible.builtin.iptables:
    table: nat
    chain: POSTROUTING
    source: "{{ item }}"
    out_interface: "{{ wifi_if }}"
    jump: MASQUERADE
  loop: "{{ gw_nets }}"
  notify: save iptables

- name: 안 → 와이파이 허용
  ansible.builtin.iptables:
    chain: "{{ fwd_chain }}"
    action: insert
    in_interface: "{{ item.dev }}"
    out_interface: "{{ wifi_if }}"
    source: "{{ item.net }}"
    jump: ACCEPT
  loop: "{{ gw_pass }}"
  loop_control: { label: "{{ item.dev }} {{ item.net }}" }
  notify: save iptables

- name: 와이파이 → 안 응답 허용
  ansible.builtin.iptables:
    chain: "{{ fwd_chain }}"
    action: insert
    in_interface: "{{ wifi_if }}"
    out_interface: "{{ item.dev }}"
    destination: "{{ item.net }}"
    ctstate: [RELATED, ESTABLISHED]
    jump: ACCEPT
  loop: "{{ gw_pass }}"
  loop_control: { label: "{{ item.dev }} {{ item.net }}" }
  notify: save iptables

# 브리지 안의 통신. Docker가 있으면 br_netfilter 때문에 브리지 패킷도 FORWARD를 거쳐서 막힐 수 있음
# br0: VM과 내부망. 바깥 브리지: io와 fw 쌍의 바깥 NIC
- name: 브리지 안 통신 허용
  ansible.builtin.iptables:
    chain: "{{ fwd_chain }}"
    action: insert
    in_interface: "{{ item }}"
    out_interface: "{{ item }}"
    jump: ACCEPT
  loop: "{{ gw_inner_devs }}"
  notify: save iptables
