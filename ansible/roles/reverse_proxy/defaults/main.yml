# 리버스 프록시 VM 쌍 3개 (rp_core, rp_ota, rp_cdn). 같은 role이고 차이는 group_vars/rp_*.yml (docs/reverse-proxy.md)
# 쌍마다 group_vars에 두는 값: rproxy_tls, rproxy_port, rproxy_vrrp_id, rproxy_vips, rproxy_sites
rproxy_tls: false
rproxy_port: 80
rproxy_iface: enp1s0   # VM NIC (roles/libvirt/templates/network-config.j2의 set-name)
rproxy_allowed_ifaces: # rproxy_port를 받는 인터페이스. 나머지는 차단 (Vault 8200과 같은 방식)
  - lo
  - "{{ rproxy_iface }}"
rproxy_tls_dir: /etc/nginx/tls
rproxy_tls_days: 825

# Kibana 인증서 확인용 CA. log의 efk CA(efk role이 만든 공개 인증서)를 가져와 둠
rproxy_log_ca_src: /etc/elasticsearch/tls/efk-ca.crt
rproxy_log_ca: "{{ rproxy_tls_dir }}/log-ca.crt"

# keepalived. 쌍의 -1이 평소 VIP를 들고, nginx가 멈추거나 VM이 멈추면 -2가 넘겨받음
# 같은 L2에 VRRP가 여럿이라 멀티캐스트 대신 짝에게만 보냄 (unicast_peer)
rproxy_vrrp_priority: "{{ 150 if inventory_hostname.endswith('-1') else 100 }}"
rproxy_vrrp_peers: "{{ groups[rproxy_pair] | difference([inventory_hostname]) | map('extract', hostvars, 'lan_ip') | list }}"
rproxy_pair: "{{ group_names | intersect(['rp_core', 'rp_ota', 'rp_cdn']) | first }}"

# 서비스 이름 → 위쪽(nginx 뒤 서버). name은 앞부분만 쓰고 뒤에 orbit_domain이 붙음 (kibana → kibana.orbit-labs.space)
# listen: 받는 VIP. upstream: 넘길 주소. main·backup: Main 클러스터, 응답하지 않을 때만 Sub (upstream backup)
rproxy_sites: []

# Main이 응답하지 않을 때 Sub로 넘기는 기준 (rp_ota, rp_cdn)
rproxy_connect_timeout: 3s
rproxy_max_fails: 1
rproxy_fail_timeout: 10s

# 인증서 (rproxy_tls: true일 때). selfsigned(자체 서명) 또는 letsencrypt(*.orbit-labs.space 와일드카드, DNS-01) (orbit-infrastructure#38)
# rp-core 두 대가 각자 발급하고 각자 갱신함
rproxy_tls_mode: letsencrypt
rproxy_le_staging: false                         # 처음에는 staging으로 시험. 확인 뒤 false로 바꿔 정식 발급
rproxy_le_domain: "*.{{ orbit_domain }}"
rproxy_le_cert_name: "{{ orbit_domain }}{{ '-staging' if rproxy_le_staging else '' }}"
rproxy_le_live: "/etc/letsencrypt/live/{{ rproxy_le_cert_name }}"
rproxy_le_credentials: /etc/letsencrypt/cloudflare.ini
rproxy_le_propagation: 30                        # TXT 레코드를 만든 뒤 확인을 요청하기까지 기다리는 초
rproxy_le_vault_path: orbit/infra/cloudflare     # Vault KV. 키 dns_api_token. 발급자가 직접 넣고 role은 읽기만 함
