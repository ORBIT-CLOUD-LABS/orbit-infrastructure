# 리버스 프록시 VM (rp_core, rp_ota, rp_cdn): nginx + keepalived VIP
- name: 쌍 값이 있어야 함 (group_vars/rp_*.yml)
  ansible.builtin.assert:
    that:
      - rproxy_vips | length > 0
      - rproxy_sites | length > 0
      - rproxy_vrrp_id is defined
      - rproxy_vrrp_peers | length == 1
    fail_msg: "{{ inventory_hostname }}: rproxy_vips, rproxy_sites, rproxy_vrrp_id와 짝 1대가 있어야 함 (group_vars/{{ rproxy_pair }}.yml)"
    quiet: true

- name: 방화벽 (nginx가 뜨기 전에 포트를 막아 둠)
  ansible.builtin.include_tasks: firewall.yml

# 대기 쪽도 VIP에 listen해야 VIP를 넘겨받자마자 받을 수 있음. VIP가 없는 주소에도 bind를 허용
- name: VIP가 없어도 bind 허용 (재부팅 후에도 유지)
  ansible.builtin.copy:
    dest: /etc/sysctl.d/99-orbit-nonlocal-bind.conf
    content: "net.ipv4.ip_nonlocal_bind=1\n"
    mode: "0644"
  notify: apply sysctl

- name: sysctl을 nginx보다 먼저 적용
  ansible.builtin.meta: flush_handlers

- name: nginx, keepalived, 인증서 모듈용 파이썬 패키지
  ansible.builtin.apt:
    name: [nginx, keepalived, python3-cryptography]
    state: present
    update_cache: true
    cache_valid_time: 3600

# 패키지 기본 사이트는 0.0.0.0:80에서 받음. 이 role은 VIP만 씀
- name: 기본 사이트 끄기
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: reload nginx

- name: 인증서
  ansible.builtin.include_tasks: tls.yml
  when: rproxy_tls

# 미리보기 첫 실행에서는 nginx가 실제로 설치되지 않아 폴더가 없으므로 건너뜀
- name: nginx 설정 폴더가 있는지
  ansible.builtin.stat:
    path: /etc/nginx/conf.d
  register: rproxy_conf_dir

- name: 프록시 설정
  ansible.builtin.template:
    src: orbit-proxy.conf.j2
    dest: /etc/nginx/conf.d/orbit-proxy.conf
    owner: root
    group: root
    mode: "0644"
  notify: reload nginx
  when: rproxy_conf_dir.stat.exists

- name: 설정 문법 검사
  ansible.builtin.command: nginx -t
  changed_when: false
  when: not ansible_check_mode   # 미리보기 첫 실행에서는 nginx가 아직 없음

- name: nginx 켜기
  ansible.builtin.systemd_service:
    name: nginx
    state: started
    enabled: true
  when: not ansible_check_mode

- name: keepalived
  ansible.builtin.include_tasks: keepalived.yml
