---
# 기본은 모든 worker에 일반 Pod 배치. 필요할 때만 예비(reserve) 노드를 지정한다.
# workers 그룹에 없는 이름은 무시된다. 목록에서 빼고 다시 실행하면 taint가 제거된다.
k8s_reserved_nodes: []
k8s_reserved_taint_key: orbit.io/reserved
k8s_reserved_taint: "orbit.io/reserved=true:NoSchedule"

# 노드별 추가 라벨 (예: { astra-worker-1: { orbit.io/pool: app } })
k8s_node_labels: {}

# 스모크 테스트: 임시 Pod로 스케줄링·DNS 확인 후 삭제
k8s_smoke_test: true
k8s_smoke_image: busybox:1.36
