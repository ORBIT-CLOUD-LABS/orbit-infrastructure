---
wazuh_manager_address: "10.0.0.207"
wazuh_agent_version: "4.14.10-1"

wazuh_agent_deb_arches:
  x86_64: amd64
  aarch64: arm64

wazuh_agent_package_base_url: "https://packages.wazuh.com/4.x/apt/pool/main/w/wazuh-agent"
wazuh_agent_checksum_base_url: "https://packages.wazuh.com/4.x/checksums/wazuh"

# API 주소와 인증서 경로는 인벤토리의 wazuh VM 기준이다.
wazuh_agent_api_url: "https://localhost:55000"
wazuh_agent_api_ca_path: "/var/ossec/api/configuration/ssl/server.crt"
wazuh_agent_lookup_url: >-
  {{ wazuh_agent_api_url | regex_replace('/+$', '') }}/agents?q={{ ('name=' ~ inventory_hostname) | urlencode }}&limit=2

# Vault KV v2 마운트 아래에 저장하는 조회 계정 경로다.
wazuh_agent_reader_secret_path: "{{ hvault_kv_infra_prefix }}/wazuh-agent-reader"
