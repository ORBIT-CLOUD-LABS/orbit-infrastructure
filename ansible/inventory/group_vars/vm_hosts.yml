# 물리 호스트 6대 기본값. astra는 hosts.yml의 호스트 변수(net_role: gateway, net_checks)가 우선
lan_bridge: br0     # VM이 붙는 브리지. 유선 주소는 브리지가 가짐
# 인터넷으로 나가는 경로. wifi: 자기 와이파이 (방화벽 구성 전), fw: 관리 구역 게이트웨이(방화벽 VIP .254)
net_role: fw
# 적용 후 확인: 게이트웨이 VIP와, 그 VIP(방화벽)를 지나 인터넷
net_checks: ["{{ lan_gw }}", "{{ probe_ip }}"]
ansible_host: "{{ lan_ip }}"   # 관리 구역 주소로 접속. 호스트 키는 astra의 /etc/ssh/ssh_known_hosts (roles/base)
