# k3s 클러스터 4개(ota_main, ota_sub, cdn_main, cdn_sub) 공통 값
k3s_version: v1.35.9+k3s1          # 버전 고정. 바꾸면 다시 실행할 때 노드마다 설치 스크립트가 다시 돎
cilium_version: 1.20.4
k3s_server_ip: "{{ hostvars[groups['cp'][0]].lan_ip }}"
k3s_pod_cidr: 10.42.0.0/16         # k3s 기본값. Cilium IPAM과 같아야 함
k3s_service_cidr: 10.43.0.0/16     # k3s 기본값

# 클러스터 VM 자원 (모두 같음)
vm_cpu: 4
vm_mem_gb: 8
vm_disk_gb: 50
