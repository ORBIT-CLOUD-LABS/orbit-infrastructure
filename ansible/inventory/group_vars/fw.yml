# fw 쌍은 구역 게이트웨이 VIP(.254)를 자기가 들고 있으므로, 기본 경로는 바깥 NIC로 astra 바깥 다리
lan_gw: 10.10.10.200
# fw는 관측 구역에도 주소(.252·.253)가 있어 관측 VM에는 그 주소로 보임
obs_src_ip: "{{ zone_ips | select('match', '10\\.10\\.30\\.') | first }}"

# AWS Site-to-Site VPN (strongSwan). vault.yml에 터널 외부 IP 및 PSK 반영 후 활성화됨 (docs/fw.md)
fw_vpn_enabled: true
fw_vpn_tunnel1_ip: "{{ vault_aws_vpn_tunnel1_ip | default('') }}"
fw_vpn_tunnel2_ip: "{{ vault_aws_vpn_tunnel2_ip | default('') }}"
