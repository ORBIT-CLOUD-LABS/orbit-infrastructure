# HashiCorp Vault (astra)와 SSH CA 공통 값
# ansible-vault 비밀값(vault_*)과 헷갈리지 않게 hvault_로 씀
hvault_version: 2.2.1                        # 버전 고정
hvault_pkg_revision: 1                       # apt 패키지 리비전. 설치는 vault=2.2.1-1
hvault_host: "{{ groups['gateway'][0] }}"     # astra
hvault_ip: "{{ hostvars[hvault_host].lan_ip }}"
hvault_port: 8200                            # 8201(Raft)은 127.0.0.1에만
hvault_addr: "https://{{ hvault_ip }}:{{ hvault_port }}"
hvault_tls_dir: /opt/vault/tls               # astra. vault-ca.crt로 Vault 인증서를 검증. 패키지의 tls.crt/tls.key와 겹치지 않게 vault-* 이름
hvault_allowed_ifaces:                       # 8200을 받는 인터페이스. 나머지는 차단
  - lo
  - "{{ hostvars[hvault_host].lan_bridge }}"   # br0
  - tailscale0

# SSH CA
hvault_ssh_mount: ssh-client-signer
hvault_ssh_role: orbit
hvault_ssh_user: orbit                       # 인증서는 이 계정에만
hvault_ssh_cert_ttl: 8h
hvault_ssh_cert_max_ttl: 8h
hvault_ssh_personal_role_prefix: personal-
hvault_ssh_personal_policy_prefix: ssh-personal-

# 로그인 (GitHub orbit 팀). 탈퇴 후 새 접속은 최대 토큰 24h + 인증서 8h
hvault_github_org: ORBIT-CLOUD-LABS
hvault_github_team: orbit
hvault_token_ttl: 8h
hvault_token_max_ttl: 24h

# 앱 비밀값 (KV v2). k3s 앱은 External Secrets Operator가 읽음 (orbit-gitops)
hvault_kv_mount: secret
hvault_kv_prefix: orbit                      # 앱별 경로: secret/orbit/<앱 이름>
hvault_kv_read_policy: eso-orbit             # 읽기만. ESO에 줌
hvault_kv_write_policy: orbit-secrets-write  # 쓰기. GitHub orbit 팀에 SSH 정책과 함께 줌

# Kubernetes 인증. ESO가 자기 ServiceAccount 토큰으로 로그인하고, Vault가 k3s API로 진위를 확인
hvault_k8s_mount: kubernetes
hvault_k8s_host: "https://{{ hostvars[groups['cp'][0]].lan_ip }}:6443"   # polaris. k3s_server_ip와 같은 값 (그 변수는 k3s 그룹에만 있음)
hvault_k8s_ca_file: /var/lib/rancher/k3s/server/tls/server-ca.crt     # polaris. API 서버 인증서를 서명한 k3s-server-ca
hvault_eso_role: eso
hvault_eso_namespace: external-secrets
hvault_eso_service_account: external-secrets
hvault_eso_audience: https://kubernetes.default.svc.cluster.local  # k3s 기본 API audience. ESO TokenRequest도 같은 값 사용
hvault_eso_token_ttl: 1h
hvault_eso_token_max_ttl: 1h                 # 갱신을 포함한 최대 수명. ESO는 재로그인으로 새 토큰 발급

# 인터넷(GitHub)이 안 될 때 쓰는 비상 계정. SSH 서명만. 비밀번호는 vault.yml (ansible-vault)
hvault_breakglass_users: [breakglass1, breakglass2]
hvault_breakglass_passwords:
  breakglass1: "{{ vault_breakglass1_password }}"
  breakglass2: "{{ vault_breakglass2_password }}"

# Raft 스냅샷 백업 (#11). 버킷·IAM은 콘솔 생성. docs/aws.md 참조
hvault_snapshot_bucket: orbit-vault-snapshot-backup
hvault_snapshot_prefix: "vault/"             # IAM 정책과 수명 주기 규칙이 이 접두사에만 걸려 있다
hvault_snapshot_region: ap-northeast-2
hvault_snapshot_policy: vault-snapshot       # sys/storage/raft/snapshot read만
hvault_snapshot_role: vault-snapshot         # AppRole 이름. 127.0.0.1/32로 묶음
hvault_snapshot_token_ttl: 10m               # 스냅샷 한 번 받고 끝나는 토큰. 길 필요가 없다
hvault_snapshot_token_max_ttl: 30m
