# HashiCorp Vault (vault VM, 관리 구역)와 SSH CA 공통 값
# ansible-vault 비밀값(vault_*)과 헷갈리지 않게 hvault_로 씀
hvault_version: 2.2.1                        # 버전 고정
hvault_pkg_revision: 1                       # apt 패키지 리비전. 설치는 vault=2.2.1-1
hvault_host: vault                           # astra 위 VM. 플레이북은 hosts: vault
hvault_ip: "{{ hostvars[hvault_host].lan_ip }}"   # 10.10.0.1. Ansible은 이 주소로 접속
hvault_name: "vault.{{ orbit_domain }}"      # 팀원 스크립트와 ESO가 쓰는 이름 (Cloudflare DNS only, 10.10.0.1). 서버 인증서 SAN에 들어감
hvault_port: 8200                            # 8201(Raft)은 127.0.0.1에만
hvault_addr: "https://{{ hvault_ip }}:{{ hvault_port }}"
hvault_node_id: astra                        # Raft node_id. 스냅샷을 받은 원래 노드 이름과 같아야 함 (다르면 복원 뒤 sealed). VM으로 옮겨도 바꾸지 않음
hvault_tls_dir: /opt/vault/tls               # vault VM. vault-ca.crt로 Vault 인증서를 검증. 패키지의 tls.crt/tls.key와 겹치지 않게 vault-* 이름
hvault_allowed_ifaces:                       # 8200을 받는 인터페이스. 나머지는 차단
  - lo
  - enp1s0                                   # VM NIC (libvirt role network-config.j2의 set-name). 팀원(Tailscale)은 astra를 거쳐, 클러스터는 fw를 거쳐 여기로 들어옴

# SSH CA
hvault_ssh_mount: ssh-client-signer
hvault_ssh_role: orbit
hvault_ssh_user: orbit                       # 인증서는 이 계정에만
hvault_ssh_cert_ttl: 8h
hvault_ssh_cert_max_ttl: 8h
hvault_ssh_personal_role_prefix: personal-
hvault_ssh_personal_policy_prefix: ssh-personal-

# 로그인 (GitHub orbit 팀). 탈퇴 후 새 접속은 최대 토큰 24h + 인증서 8h
hvault_github_org: ORBIT-CLOUD-LABS
hvault_github_team: orbit
hvault_token_ttl: 8h
hvault_token_max_ttl: 24h

# 비밀값 (KV v2). k3s 앱은 External Secrets Operator가 읽음 (orbit-gitops)
hvault_kv_mount: secret
# ESO는 k3s 구역만 읽음. 인프라 구역(Elasticsearch 관리자 등)은 팀만 다룸
hvault_kv_prefix: orbit                                   # 팀이 관리하는 전체 범위: secret/orbit/
hvault_kv_k3s_prefix: "{{ hvault_kv_prefix }}/k3s"         # k3s 앱: secret/orbit/k3s/<앱 이름>
hvault_kv_infra_prefix: "{{ hvault_kv_prefix }}/infra"     # 인프라: secret/orbit/infra/<서비스 이름>
hvault_kv_read_policy: eso-orbit             # k3s 구역 읽기만. ESO에 줌
hvault_kv_write_policy: orbit-secrets-write  # 두 구역 쓰기. GitHub orbit 팀에 SSH 정책과 함께 줌

# Kubernetes 인증. 클러스터마다 로그인 경로 하나(auth/kubernetes-<클러스터 이름>)
# ESO가 자기 ServiceAccount 토큰으로 로그인하고, Vault가 그 클러스터 API(VIP, k3s_api_url)로 진위를 확인
hvault_k8s_mount_prefix: kubernetes
hvault_k8s_clusters: [ota_main, ota_sub, cdn_main, cdn_sub]          # 클러스터 그룹. 비워 두면 Kubernetes 인증 설정을 건너뜀
hvault_k8s_ca_file: /var/lib/rancher/k3s/server/tls/server-ca.crt     # 각 클러스터 -1. API 서버 인증서를 서명한 k3s-server-ca
hvault_eso_role: eso
hvault_eso_namespace: external-secrets
hvault_eso_service_account: external-secrets
hvault_eso_audience: https://kubernetes.default.svc.cluster.local  # k3s 기본 API audience. ESO TokenRequest도 같은 값 사용
hvault_eso_token_ttl: 1h
hvault_eso_token_max_ttl: 1h                 # 갱신을 포함한 최대 수명. ESO는 재로그인으로 새 토큰 발급

# 인터넷(GitHub)이 안 될 때 쓰는 비상 계정. SSH 서명만. 비밀번호는 vault.yml (ansible-vault)
# 계정을 처음 만들 때만 필요함. vault.yml이 없는 곳(팀원 Mac)에서도 이미 있는 계정은 그대로 두고 진행
hvault_breakglass_users: [breakglass1, breakglass2]
hvault_breakglass_passwords:
  breakglass1: "{{ vault_breakglass1_password | default('') }}"
  breakglass2: "{{ vault_breakglass2_password | default('') }}"

# Raft 스냅샷 백업 (#11, #76, #84). 버킷·IAM·사설 엔드포인트는 docs/aws.md 참조
hvault_snapshot_bucket: orbit-vault-snapshot-prod
hvault_snapshot_prefix: "vault/"             # IAM 정책과 수명 주기 규칙이 이 접두사에만 걸려 있다
hvault_snapshot_region: ap-northeast-2
# 사설 S3 인터페이스 엔드포인트 URL은 공개 저장소 노출 방지를 위해 vault.yml에서 읽음 (비우면 기본 S3 엔드포인트 사용)
hvault_snapshot_endpoint_url: "{{ vault_aws_s3_vpce_endpoint_url | default('') }}"
hvault_snapshot_policy: vault-snapshot       # sys/storage/raft/snapshot read만
hvault_snapshot_role: vault-snapshot         # AppRole 이름. 127.0.0.1/32로 묶음
hvault_snapshot_token_ttl: 10m               # 스냅샷 한 번 받고 끝나는 토큰. 길 필요가 없다
hvault_snapshot_token_max_ttl: 30m
