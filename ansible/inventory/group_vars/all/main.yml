# 내부망
lan_net: 10.10.0.0/16       # 온프레미스 전체 (구역은 10.10.<구역>.0/24)
lan_prefix: 24              # 구역 하나의 길이
lan_gw: "{{ lan_ip | regex_replace('\\.[0-9]+$', '.254') }}"   # 자기 구역의 방화벽 VIP .254
outer_net: 10.10.10.0/24    # 바깥 구역 (astra 바깥 다리, io, 방화벽 바깥 VIP)
obs_net: 10.10.30.0/24      # 관측 구역. 수집은 방화벽을 거치지 않고 직접 보냄 (같은 L2)
fw_outer_vip: 10.10.10.254  # 방화벽 바깥 VIP. astra가 관리 구역 밖 대역으로 보낼 때의 다음 홉
obs_src_ip: "{{ lan_ip }}"   # 관측 VM(log, metric, secure)에 보이는 출발지 주소. 관측 구역에 주소가 있는 fw만 다름 (group_vars/fw.yml)

# 와이파이
wifi_ssid: rapa_classroom-5
wifi_gw: 192.168.200.1
wifi_prefix: 22
wifi_psk: "{{ vault_wifi_psk }}"   # inventory/group_vars/all/vault.yml (ansible-vault로 암호화)

dns: [8.8.8.8, 1.1.1.1]
probe_ip: 1.0.0.1 # 인터넷 확인용 (astra의 적용 후 확인 ping)
metric_main: 100           # 평소 쓰는 기본 경로
metric_backup: 600         # 예비 기본 경로 (net_role: fw일 때의 와이파이)

# 도메인 (Cloudflare DNS). 서비스 이름은 <앞부분>.{{ orbit_domain }} (docs/reverse-proxy.md)
orbit_domain: orbit-labs.space


# 시간대 (전 장비). 로그·터미널 시각을 한국 시간으로 (orbit-infrastructure#39)
orbit_timezone: Asia/Seoul