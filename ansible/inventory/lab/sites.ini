# 원격 사이트 VM (Tailscale로 연결) — 손으로 관리하는 인벤토리
# ansible.cfg의 inventory= 목록에 직접 나열되어 있어서 함께 읽힌다 (폴더 단위 지정이 아니다).
#
# 채우는 법: 각 VM에서 `tailscale ip -4` → 100.x 주소를 넣고 줄 앞 #을 지운다.
# Prometheus(Monitoring VM)도 이 주소로 수집하므로 MagicDNS 이름 대신 IP를 쓴다.

[sol]
# orbit-sol ansible_host=100.x.x.x ansible_user=orbit

[terra]
# orbit-terra ansible_host=100.x.x.x ansible_user=orbit

[luna]
# orbit-luna ansible_host=100.x.x.x ansible_user=orbit

# 역할 그룹 (롤의 hosts: 에서 사용)
[cdn:children]
sol

[campaign_db:children]
terra

[agents:children]
luna

[remote:children]
sol
terra
luna
