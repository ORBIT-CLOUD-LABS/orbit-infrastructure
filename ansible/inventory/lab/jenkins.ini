# astra-jenkins — 손으로 관리하는 인벤토리
# #7(Jenkins 스택 분리) 이후 stacks/jenkins에서 따로 관리되어 Terraform이 만드는
# hosts.ini(environments/astra)에는 더 이상 포함되지 않는다.
# node-exporter 등 monitoring_node_exporter_groups(jenkins)가 이 그룹을 찾으므로,
# 빠지면 모니터링 대상에서 조용히 누락된다 (PR #15 리뷰 코멘트 참고).
# ansible.cfg의 inventory= 목록에 직접 나열되어 있어야 읽힌다.

[jenkins]
astra-jenkins ansible_host=192.168.100.100 ansible_user=orbit
