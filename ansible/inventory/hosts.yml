        polaris:
          {
            ansible_host: 10.0.0.200,
            lan_ip: 10.0.0.200,
            wifi_ip: 192.168.200.200,
            lan_mac: "00:1e:06:53:05:86",
            wifi_mac: "e0:e1:a9:33:e7:91",
