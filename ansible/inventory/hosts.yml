all:
  # 공통 값(lan_net, lan_gw 등)은 group_vars/all/main.yml
  # 물리 호스트 ansible_host는 network 이슈(새 주소 적용) 전까지 옛 주소. 옛 대역 정리 때 lan_ip로 바꿈
  # 주소 규칙: 10.10.<구역>.<끝자리>. VM .1~, VIP .100~, 물리 호스트 .200~.206, fw .252·.253, 게이트웨이 .254
  children:
    # 물리 호스트 (관리 구역 10.10.0.0/24). VM을 올리는 호스트
    vm_hosts:
      hosts:
        astra:
          {
            # astra에서 실행하면 자기 자신은 로컬로. 다른 곳에서 실행하면 SSH로 (astra용 작업이 실행한 컴퓨터에서 돌지 않게)
            ansible_connection: "{{ 'local' if lookup('ansible.builtin.pipe', 'hostname -s') == 'astra' else 'ssh' }}",
            ansible_host: 10.0.0.201,  # 옛 주소
            old_lan_ip: 10.0.0.201,    # 옛 내부망 주소. 새 주소와 함께 두다가 옛 대역 정리 때 지움
            lan_ip: 10.10.0.200,
            wifi_ip: 192.168.200.200,
            lan_mac: "00:e0:4b:41:1f:c0",
            wifi_mac: "70:1a:b8:74:05:27",
            lan_bridge: br0,
            tailscale_ip: 100.94.67.18,
            net_role: gateway,
            # 바깥 구역 다리 (10.10.10.0/24). fw 쌍의 바깥 NIC와 io가 붙는 브리지
            outer_bridge: br-outer,
            outer_ip: 10.10.10.200,
            outer_mac: "8c:b0:e9:97:b4:dd",  # io에 직결하는 내장 랜(enp3s0). 이 포트가 바깥 브리지에 들어감
            # 적용 후 확인: 내부망 다른 노드(sol의 옛 주소. astra를 먼저 적용할 때 sol에는 새 주소가 없음)와 인터넷(와이파이)
            net_checks: ["{{ hostvars['sol'].old_lan_ip }}", "{{ probe_ip }}"],
          }
        sol:
          {
            ansible_host: 10.0.0.202,  # 옛 주소
            old_lan_ip: 10.0.0.202,
            lan_ip: 10.10.0.201,
            wifi_ip: 192.168.200.201,
            lan_mac: "8c:b0:e9:50:1f:96",
            wifi_mac: "e8:c8:29:b2:26:3b",
          }
        mercury:
          {
            # 옛 주소가 없음. 새 주소 적용 전까지 ansible_host 없이 tailnet MagicDNS 이름(mercury)으로 접속
            lan_ip: 10.10.0.202,
            wifi_ip: 192.168.200.202,
            lan_mac: "8c:b0:e9:50:1f:19",
            wifi_mac: "e8:c8:29:b0:98:52",
          }
        vesper:
          {
            # 옛 주소가 없음. 새 주소 적용 전까지 ansible_host 없이 tailnet MagicDNS 이름(vesper)으로 접속
            lan_ip: 10.10.0.203,
            wifi_ip: 192.168.200.203,
            lan_mac: "8c:b0:e9:4e:ab:40",
            wifi_mac: "60:45:2e:50:bc:43",
          }
        terra:
          {
            ansible_host: 10.0.0.203,  # 옛 주소
            old_lan_ip: 10.0.0.203,
            lan_ip: 10.10.0.204,
            wifi_ip: 192.168.200.204,
            lan_mac: "8c:b0:e9:4e:a9:a5",
            wifi_mac: "60:45:2e:50:6f:0e",
          }
        luna:
          {
            ansible_host: 10.0.0.204,  # 옛 주소
            old_lan_ip: 10.0.0.204,
            lan_ip: 10.10.0.205,
            wifi_ip: 192.168.200.205,
            lan_mac: "8c:b0:e9:4f:60:5f",
            wifi_mac: "4c:5f:70:04:76:e9",
          }

    # VM 전체. 역할 그룹을 묶음 (공통 값은 group_vars/vms.yml)
    vms:
      children:
        fw:
        rp_core:
        rp_ota:
        rp_cdn:
        obs:
        k3s:
      hosts:
        # Vault (astra, 관리 구역). 호스트 이름과 겹치지 않게 vault 그룹은 두지 않음. 플레이북은 hosts: vault로 이 호스트를 가리킴
        vault:
          {
            vm_host: astra,
            ansible_host: 10.10.0.1,
            lan_ip: 10.10.0.1,
            vm_mac: "52:54:00:0a:00:01",
            vm_cpu: 1,
            vm_mem_gb: 2,
            vm_disk_gb: 20,
          }

    # 방화벽 쌍 (astra). 구역마다 .252·.253, 게이트웨이 VIP .254
    fw:
      hosts:
        fw-1:
          {
            vm_host: astra,
            ansible_host: 10.10.0.252,
            lan_ip: 10.10.0.252,
            vm_mac: "52:54:00:0a:00:fc",
            outer_ip: 10.10.10.252,
            outer_mac: "52:54:00:0a:0a:fc",
            zone_ips: [10.10.20.252, 10.10.30.252, 10.10.41.252, 10.10.42.252, 10.10.51.252, 10.10.52.252],  # 구역별 주소 (안쪽 NIC). VIP .254는 keepalived
            vm_cpu: 2,
            vm_mem_gb: 2,
            vm_disk_gb: 10,
          }
        fw-2:
          {
            vm_host: astra,
            ansible_host: 10.10.0.253,
            lan_ip: 10.10.0.253,
            vm_mac: "52:54:00:0a:00:fd",
            outer_ip: 10.10.10.253,
            outer_mac: "52:54:00:0a:0a:fd",
            zone_ips: [10.10.20.253, 10.10.30.253, 10.10.41.253, 10.10.42.253, 10.10.51.253, 10.10.52.253],  # 구역별 주소 (안쪽 NIC). VIP .254는 keepalived
            vm_cpu: 2,
            vm_mem_gb: 2,
            vm_disk_gb: 10,
          }

    # 리버스 프록시 쌍 3개 (astra, 리버스 프록시 구역 10.10.20.0/24)
    rp_core:
      hosts:
        rp-core-1:
          {
            vm_host: astra,
            ansible_host: 10.10.20.1,
            lan_ip: 10.10.20.1,
            vm_mac: "52:54:00:0a:14:01",
            vm_cpu: 2,
            vm_mem_gb: 2,
            vm_disk_gb: 20,
          }
        rp-core-2:
          {
            vm_host: astra,
            ansible_host: 10.10.20.2,
            lan_ip: 10.10.20.2,
            vm_mac: "52:54:00:0a:14:02",
            vm_cpu: 2,
            vm_mem_gb: 2,
            vm_disk_gb: 20,
          }
    rp_ota:
      hosts:
        rp-ota-1:
          {
            vm_host: astra,
            ansible_host: 10.10.20.3,
            lan_ip: 10.10.20.3,
            vm_mac: "52:54:00:0a:14:03",
            vm_cpu: 1,
            vm_mem_gb: 1,
            vm_disk_gb: 10,
          }
        rp-ota-2:
          {
            vm_host: astra,
            ansible_host: 10.10.20.4,
            lan_ip: 10.10.20.4,
            vm_mac: "52:54:00:0a:14:04",
            vm_cpu: 1,
            vm_mem_gb: 1,
            vm_disk_gb: 10,
          }
    rp_cdn:
      hosts:
        rp-cdn-1:
          {
            vm_host: astra,
            ansible_host: 10.10.20.5,
            lan_ip: 10.10.20.5,
            vm_mac: "52:54:00:0a:14:05",
            vm_cpu: 1,
            vm_mem_gb: 1,
            vm_disk_gb: 10,
          }
        rp-cdn-2:
          {
            vm_host: astra,
            ansible_host: 10.10.20.6,
            lan_ip: 10.10.20.6,
            vm_mac: "52:54:00:0a:14:06",
            vm_cpu: 1,
            vm_mem_gb: 1,
            vm_disk_gb: 10,
          }

    # 관측 (관측 구역 10.10.30.0/24). log·metric은 luna, secure는 astra
    obs:
      hosts:
        log:
          {
            vm_host: luna,
            ansible_host: 10.10.30.1,
            lan_ip: 10.10.30.1,
            vm_mac: "52:54:00:0a:1e:01",
            vm_cpu: 4,
            vm_mem_gb: 14,
            vm_disk_gb: 90,
          }
        metric:
          {
            vm_host: luna,
            ansible_host: 10.10.30.2,
            lan_ip: 10.10.30.2,
            vm_mac: "52:54:00:0a:1e:02",
            vm_cpu: 4,
            vm_mem_gb: 10,
            vm_disk_gb: 60,
          }
        secure:
          {
            vm_host: astra,
            ansible_host: 10.10.30.3,
            lan_ip: 10.10.30.3,
            vm_mac: "52:54:00:0a:1e:03",
            vm_cpu: 4,
            vm_mem_gb: 12,
            vm_disk_gb: 60,
          }

    # k3s 클러스터 4개. 클러스터 하나가 구역 하나, 노트북 하나 (공통 값은 group_vars/k3s.yml)
    k3s:
      children:
        ota_main:
        ota_sub:
        cdn_main:
        cdn_sub:
    ota_main:   # sol, 10.10.41.0/24
      hosts:
        ota-main-1: { vm_host: sol, ansible_host: 10.10.41.1, lan_ip: 10.10.41.1, vm_mac: "52:54:00:0a:29:01" }
        ota-main-2: { vm_host: sol, ansible_host: 10.10.41.2, lan_ip: 10.10.41.2, vm_mac: "52:54:00:0a:29:02" }
        ota-main-3: { vm_host: sol, ansible_host: 10.10.41.3, lan_ip: 10.10.41.3, vm_mac: "52:54:00:0a:29:03" }
    ota_sub:    # mercury, 10.10.42.0/24
      hosts:
        ota-sub-1: { vm_host: mercury, ansible_host: 10.10.42.1, lan_ip: 10.10.42.1, vm_mac: "52:54:00:0a:2a:01" }
        ota-sub-2: { vm_host: mercury, ansible_host: 10.10.42.2, lan_ip: 10.10.42.2, vm_mac: "52:54:00:0a:2a:02" }
        ota-sub-3: { vm_host: mercury, ansible_host: 10.10.42.3, lan_ip: 10.10.42.3, vm_mac: "52:54:00:0a:2a:03" }
    cdn_main:   # vesper, 10.10.51.0/24
      hosts:
        cdn-main-1: { vm_host: vesper, ansible_host: 10.10.51.1, lan_ip: 10.10.51.1, vm_mac: "52:54:00:0a:33:01" }
        cdn-main-2: { vm_host: vesper, ansible_host: 10.10.51.2, lan_ip: 10.10.51.2, vm_mac: "52:54:00:0a:33:02" }
        cdn-main-3: { vm_host: vesper, ansible_host: 10.10.51.3, lan_ip: 10.10.51.3, vm_mac: "52:54:00:0a:33:03" }
    cdn_sub:    # terra, 10.10.52.0/24
      hosts:
        cdn-sub-1: { vm_host: terra, ansible_host: 10.10.52.1, lan_ip: 10.10.52.1, vm_mac: "52:54:00:0a:34:01" }
        cdn-sub-2: { vm_host: terra, ansible_host: 10.10.52.2, lan_ip: 10.10.52.2, vm_mac: "52:54:00:0a:34:02" }
        cdn-sub-3: { vm_host: terra, ansible_host: 10.10.52.3, lan_ip: 10.10.52.3, vm_mac: "52:54:00:0a:34:03" }

    wazuh_agents:   # 매니저(secure)를 뺀 물리 호스트와 클러스터 밖 VM. 클러스터 VM은 k3s 작업에서 추가
      children:
        vm_hosts:
        fw:
        rp_core:
        rp_ota:
        rp_cdn:
      hosts:
        vault: {}
        log: {}
        metric: {}
