all:
  # 공통 값(lan_net, lan_gw 등)은 group_vars/all/main.yml
  children:
    gateway:
      hosts:
        astra:
          {
            # astra에서 실행하면 자기 자신은 로컬로. 다른 곳에서 실행하면 SSH로 (astra용 작업이 실행한 컴퓨터에서 돌지 않게)
            ansible_connection: "{{ 'local' if lookup('ansible.builtin.pipe', 'hostname -s') == 'astra' else 'ssh' }}",
            ansible_host: 10.0.0.201,
            lan_ip: 10.0.0.201,
            wifi_ip: 192.168.200.201,
            lan_mac: "00:e0:4b:41:1f:c0",
            wifi_mac: "70:1a:b8:74:05:27",
            lan_bridge: br0,
            tailscale_ip: 100.94.67.18,
          }
    cp:
