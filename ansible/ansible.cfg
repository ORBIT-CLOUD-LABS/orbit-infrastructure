[defaults]
inventory = inventory/hosts.yml
# astra에서 개인 계정으로 실행 (docs/personal-accounts.md#ansible-실행). 접속 계정과 키는 정하지 않음
# 실행한 계정명과 그 계정의 Vault SSH 인증서(scripts/orbit-ssh-cert.sh)로 접속해서, 대상 호스트의 SSH·sudo 로그에 실행한 사람이 남음
# 자동화 계정(orbit)은 새 VM 첫 구성과 비상시에만: -u orbit --private-key ~/.ssh/orbit_ansible
interpreter_python = auto_silent
roles_path = roles
callback_result_format = yaml

[ssh_connection]
pipelining = True
