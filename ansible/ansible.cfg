[defaults]
inventory = inventory/lab/hosts.ini,inventory/lab/astra_host.ini
roles_path = roles
host_key_checking = False
retry_files_enabled = False

[privilege_escalation]
# become_user(postgres)로 전환 시 임시 파일 권한 부여에 OS별 ACL chmod(예: Solaris/ZFS
# 스타일 "A+user:...")를 시도하다 실패하는 환경이 있어 world-readable로 완화한다.
# 참고: https://docs.ansible.com/ansible-core/2.16/playbook_guide/playbooks_privilege_escalation.html#risks-of-becoming-an-unprivileged-user
allow_world_readable_tmpfiles = True
